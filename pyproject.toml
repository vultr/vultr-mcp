[project]
name = "vultr-mcp"
version = "2.0.0"
description = "Python MCP (Model Context Protocol) server for the Vultr cloud platform, built on FastMCP"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14",
    "httpx>=0.28",
    "py-key-value-aio[redis]>=0.4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vultr_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
