apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vultr-mcp
  labels:
    app: vultr-mcp
  annotations:
    # Uncomment and adjust for your cert-manager / ingress controller:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/rate-limit: "30"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx  # Adjust to your ingress class
  tls:
    - hosts:
        - mcp.vultr.com
      secretName: vultr-mcp-tls
  rules:
    - host: mcp.vultr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vultr-mcp
                port:
                  number: 8000
