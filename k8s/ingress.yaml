apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # A name of its own so this can be applied ahead of the app, letting Traefik get the certificate before cutover.
  name: mcp-vultr-com
  labels:
    app: vultr-mcp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mcp.vultr.com
  rules:
    - host: mcp.vultr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vultr-mcp
                port:
                  number: 8000