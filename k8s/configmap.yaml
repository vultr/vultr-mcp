apiVersion: v1
kind: ConfigMap
metadata:
  name: vultr-mcp-config
  labels:
    app: vultr-mcp
data:
  VULTR_MCP_TRANSPORT: "http"
  SSL_VERIFY: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # ---- OAuth 2.1 / OIDC via FastMCP OAuthProxy ----
  # OAuth + header auth run side by side via DualTokenVerifier. Requires
  # VULTR_OAUTH_CLIENT_SECRET in the secret and the platform /oauth/authorize
  # fix live (both in place as of the recreate).
  VULTR_OIDC_ENABLED: "true"
  VULTR_OIDC_PROVIDER_ID: "d66bf304-1e2b-4b7f-93f7-2a8c3a23df1f"
  VULTR_OAUTH_CLIENT_ID: "56377b7e-ffbc-4a65-a704-e215e89f3d44"
  MCP_RESOURCE_URL: "https://vultrmcp.com"
  # aud defaults to VULTR_OAUTH_CLIENT_ID; override only if Vultr changes it.
  # VULTR_OIDC_AUDIENCE: ""

  # ---- Tool surface ----
  # Read-only. Stated explicitly rather than left to the default so the write
  # posture of this deployment is visible in the manifest, not just in code.
  # Verify on a live pod with: curl -s https://vultrmcp.com/healthz
  VULTR_MCP_WRITES_ENABLED: "false"
  # Identity categories excluded by default; empty string disables exclusions.
  # VULTR_MCP_EXCLUDED_CATEGORIES: "api-keys,users,iam,scim,organizations,oidc"
  # Category endpoints to expose (default: all non-excluded). Trim to reduce
  # boot cost / session-manager count per replica.
  # VULTR_MCP_CATEGORY_ENDPOINTS: "instances,kubernetes,dns,firewall,block"
