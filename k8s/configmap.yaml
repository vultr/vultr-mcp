apiVersion: v1
kind: ConfigMap
metadata:
  name: vultr-mcp-config
  labels:
    app: vultr-mcp
data:
  VULTR_MCP_TRANSPORT: "http"
  # Otherwise a pod that dies during startup leaves no logs.
  PYTHONUNBUFFERED: "1"
  SSL_VERIFY: "true"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # ---- OAuth 2.1 / OIDC via FastMCP OAuthProxy ----
  # OAuth and raw API keys both work; VULTR_OAUTH_CLIENT_SECRET goes in the secret.
  VULTR_OIDC_ENABLED: "true"
  VULTR_OIDC_PROVIDER_ID: "d66bf304-1e2b-4b7f-93f7-2a8c3a23df1f"
  VULTR_OAUTH_CLIENT_ID: "56377b7e-ffbc-4a65-a704-e215e89f3d44"
  MCP_RESOURCE_URL: "https://mcp.vultr.com"
  # aud defaults to VULTR_OAUTH_CLIENT_ID; override only if Vultr changes it.
  # VULTR_OIDC_AUDIENCE: ""

  # ---- Audit records ----
  # Records always go to stdout. Set this to also write them as files, one per event type, for a log shipper.
  # VULTR_MCP_AUDIT_DIR: "/var/log/vultr-mcp"

  # ---- Tool surface ----
  # Always read-only; there is no write switch.
  # Identity categories excluded by default; empty string disables exclusions.
  # VULTR_MCP_EXCLUDED_CATEGORIES: "api-keys,users,iam,scim,organizations,oidc"
  # Endpoint groups to mount (default: all).
  # VULTR_MCP_CATEGORY_ENDPOINTS: "instances,kubernetes,dns,firewall,block"
