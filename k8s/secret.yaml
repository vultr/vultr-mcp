apiVersion: v1
kind: Secret
metadata:
  name: vultr-mcp-secrets
  labels:
    app: vultr-mcp
type: Opaque
stringData:
  # MCP_AUTH_TOKEN: Optional bearer token gate for the public endpoint.
  # If set, clients must send Authorization: Bearer <this value>.
  # If empty, per-user X-Vultr-API-Key is the sole auth layer.
  MCP_AUTH_TOKEN: ""

  # VULTR_API_KEY: Not needed in per-user mode (users provide their own).
  # Set only if you want a fallback key for legacy / internal use.
  VULTR_API_KEY: ""
