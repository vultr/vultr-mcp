apiVersion: apps/v1
kind: Deployment
metadata:
  name: vultr-mcp
  labels:
    app: vultr-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vultr-mcp
  template:
    metadata:
      labels:
        app: vultr-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: vcr-creds
      containers:
        - name: vultr-mcp
          image: atl.vultrcr.com/vrnd/vultr-mcp:2.1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vultr-mcp-config
            - secretRef:
                name: vultr-mcp-secrets
          resources:
            requests:
              # Back to 200m. It was raised to 500m to buy a faster boot when
              # boot was ~38s of redundant recompilation; at ~4.5s the extra
              # guaranteed CPU no longer earns its scheduling cost.
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Boot builds a FastMCP server per category endpoint (~36) over the
          # 1.6MB OpenAPI spec, which on a busy node takes well past the 10s the
          # liveness probe used to allow — the container was SIGKILLed mid-start
          # and crash-looped (exit 137). startupProbe gives it up to 150s to come
          # up and suppresses liveness until it does; liveness then guards the
          # steady state as before.
          # 5s x 30 = 150s, back where it was. It was briefly raised to 450s
          # for a boot that took 38s on a full core and ~300s throttled, before
          # that turned out to be the interface layer recompiling once per
          # server: 35 servers, identical result each time. Caching it (see
          # load_interface) took boot to ~4.5s, so the headroom is no longer
          # needed and a slow start should fail loudly again rather than be
          # absorbed.
          #
          # Do not trim below this without measuring: boot is silent until
          # uvicorn binds, so a pod killed inside this window leaves no logs
          # saying why -- which is exactly how the 2.1.0 rollout failed.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
