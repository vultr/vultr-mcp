apiVersion: apps/v1
kind: Deployment
metadata:
  name: vultr-mcp
  labels:
    app: vultr-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vultr-mcp
  template:
    metadata:
      labels:
        app: vultr-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      # A read:packages token for the private ghcr.io package.
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: vultr-mcp
          image: ghcr.io/vultr/vultr-mcp:2.1.22
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vultr-mcp-config
            - secretRef:
                name: vultr-mcp-secrets
          resources:
            requests:
              cpu: 200m
              # Headroom for several large billing responses held at once.
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Up to 150s to boot (normally ~5s), silent until uvicorn binds; measure before trimming.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
