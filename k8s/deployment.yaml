apiVersion: apps/v1
kind: Deployment
metadata:
  name: vultr-mcp
  labels:
    app: vultr-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vultr-mcp
  template:
    metadata:
      labels:
        app: vultr-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: vcr-creds
      containers:
        - name: vultr-mcp
          image: atl.vultrcr.com/vrnd/vultr-mcp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vultr-mcp-config
            - secretRef:
                name: vultr-mcp-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
