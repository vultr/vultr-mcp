apiVersion: apps/v1
kind: Deployment
metadata:
  name: vultr-mcp
  labels:
    app: vultr-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vultr-mcp
  template:
    metadata:
      labels:
        app: vultr-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: vcr-creds
      containers:
        - name: vultr-mcp
          image: atl.vultrcr.com/vrnd/vultr-mcp:2.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vultr-mcp-config
            - secretRef:
                name: vultr-mcp-secrets
          resources:
            requests:
              # 500m rather than 200m. Startup is CPU-bound tool generation and
              # scales almost linearly: 302s at 0.2 CPU, ~60s at a full core.
              # 200m made a rolling restart take five minutes per pod even when
              # it succeeded. The limit stays at 1, so a pod still bursts to a
              # full core when the node has room.
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Boot builds a FastMCP server per category endpoint (~36) over the
          # 1.6MB OpenAPI spec, which on a busy node takes well past the 10s the
          # liveness probe used to allow — the container was SIGKILLed mid-start
          # and crash-looped (exit 137). startupProbe gives it up to 150s to come
          # up and suppresses liveness until it does; liveness then guards the
          # steady state as before.
          # 5s x 90 = 450s. Measured, not guessed: the image needs ~45-60s to
          # boot with a full core and 302s throttled to 0.2 CPU, which is the
          # guaranteed share the request below buys. The previous 30 (150s) was
          # set when the surface was smaller and killed every pod of the 2.1.0
          # rollout at exactly 150s, with no logs -- boot is silent until
          # uvicorn binds, so a pod dying inside this window says nothing about
          # why. Sized for the fully-throttled worst case, because that is the
          # case that actually happens under node contention.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
