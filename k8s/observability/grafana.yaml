              "rawSql": "SELECT JSONExtractString(line, 'client_id') AS client, any(JSONExtractString(line, 'client_kind')) AS kind, groupUniqArrayIf(trim(BOTH '\"' FROM JSONExtractRaw(line, 'acctid')), JSONHas(line, 'acctid')) AS accounts, countIf(JSONExtractString(line, 'action') = 'code_exchange' AND JSONExtractString(line, 'outcome') = 'ok') AS sign_ins, countIf(JSONExtractString(line, 'action') = 'refresh' AND JSONExtractString(line, 'outcome') = 'ok') AS refreshes_ok, countIf(JSONExtractString(line, 'action') = 'refresh' AND JSONExtractString(line, 'outcome') != 'ok') AS refreshes_failed, countIf(startsWith(JSONExtractString(line, 'resolved_by'), 'shared')) AS duplicates_absorbed, maxIf(timestamp, JSONExtractString(line, 'action') = 'code_exchange') AS last_sign_in FROM vultr_mcp.log_mcp_auth WHERE $__timeFilter(timestamp) GROUP BY client ORDER BY sign_ins DESC"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 27,
          "type": "table",
          "title": "Refresh failures",
          "description": "refused = the token was unknown to us (rotated, expired or revoked); error = Vultr refused it. Either way the client has to sign in again.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 12,
            "y": 62,
            "w": 12,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT timestamp AS time, JSONExtractString(line, 'client_id') AS client, trim(BOTH '\"' FROM JSONExtractRaw(line, 'acctid')) AS acctid, JSONExtractString(line, 'outcome') AS outcome, JSONExtractString(line, 'resolved_by') AS resolved_by, JSONExtractString(line, 'error') AS error, JSONExtractString(line, 'error_description') AS detail FROM vultr_mcp.log_mcp_auth WHERE $__timeFilter(timestamp) AND JSONExtractString(line, 'action') = 'refresh' AND JSONExtractString(line, 'outcome') != 'ok' ORDER BY timestamp DESC LIMIT 100"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
---
# Users, preferences and any dashboards saved in the UI. The provisioned
# dashboard and data source do not depend on it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: vultr-block-storage
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  # The volume is ReadWriteOnce: the old pod must let go before a new one mounts it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # The image's own grafana user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.2
          # Fail closed, as clickhouse.yaml does: an empty admin password makes
          # Grafana fall back to admin/admin, and an empty ClickHouse password
          # would leave the data source unable to log in without saying why.
          command:
            - /bin/sh
            - -c
            - |
              if [ -z "$GF_SECURITY_ADMIN_PASSWORD" ] || [ -z "$CLICKHOUSE_GRAFANA_PASSWORD" ]; then
                echo "refusing to start: secret grafana-admin or clickhouse-credentials has an empty password" >&2
                exit 1
              fi
              exec /run.sh
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: CLICKHOUSE_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: grafana-password
            # Installed before the server starts, so the provisioned data
            # source never exists without its plugin. Pinned: a plugin release
            # is a code change to a running system.
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: grafana-clickhouse-datasource@4.21.3
            # Grafana also installs its own default apps (advisor, drilldown,
            # pyroscope) and there is no switch for those alone: an empty
            # GF_PLUGINS_PREINSTALL keeps them, and GF_PLUGINS_PREINSTALL_DISABLED
            # stops the ClickHouse plugin too -- both measured. This at least
            # keeps what is installed from updating itself on a restart.
            - name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE
              value: "false"
            # Public behind Traefik, which terminates TLS: Grafana builds its
            # links and the OAuth callback from this, not from the request.
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.vultrmcp.com/
            - name: GF_SECURITY_COOKIE_SECURE
              value: "true"
            # Accounts are created by an admin; nobody signs themselves up.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
          # 512Mi was OOMKilled with one person on the dashboard: Grafana 13,
          # its default apps and the ClickHouse plugin's own process all count
          # against this one limit. Measured ~490Mi steady before the kill.
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            # Plugin install happens before the server binds.
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: tmp
              mountPath: /tmp
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana
        - name: tmp
          emptyDir: {}
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Its own hostname rather than vultrmcp.com/grafana: a path would put Grafana on
# the same origin as the MCP server's OAuth pages, and a flaw in one would then
# run with the other's browser privileges. *.vultrmcp.com already resolves to
# the Traefik load balancer; the certificate is issued on first request.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    app: grafana
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.vultrmcp.com
  rules:
    - host: grafana.vultrmcp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
