# Grafana over the audit records in ClickHouse (clickhouse.yaml, alongside),
# at https://grafana.vultrmcp.com. Accounts are made by hand, per person, on
# request -- there is no self sign-up and no anonymous access: a viewer can send
# its own queries to the data source, and the records carry customer account IDs.
# Grafana locks an account for a few minutes after repeated failed logins.
#
# It logs in to ClickHouse as the read-only `grafana` user, whose password is
# the grafana-password key of clickhouse-credentials. Its own admin password is
# a separate secret, created once before applying this file:
#
#   kubectl create secret generic grafana-admin --from-literal=password=<random>
#
# (the README has the PowerShell form). Grafana reads it only when it first
# creates the admin user; after that the password lives in Grafana's database
# on the volume, and is changed from the UI or `grafana cli admin reset-admin-password`.
#
# The data source and the "vultr-mcp audit" dashboard are provisioned from the
# ConfigMaps below and cannot be edited in the UI -- change them here. A copy
# saved under a new name is editable and lives on the volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app: grafana
data:
  # $CLICKHOUSE_GRAFANA_PASSWORD is expanded by Grafana from its environment.
  # queryTimeout becomes ClickHouse's max_execution_time, which the grafana
  # user's profile caps at 300.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: ClickHouse
        uid: clickhouse-vultr-mcp
        type: grafana-clickhouse-datasource
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          host: clickhouse
          port: 9000
          protocol: native
          username: grafana
          defaultDatabase: vultr_mcp
          queryTimeout: "60"
        secureJsonData:
          password: $CLICKHOUSE_GRAFANA_PASSWORD
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: vultr-mcp
        type: file
        allowUiUpdates: false
        disableDeletion: true
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app: grafana
data:
  # Generated by scripts/grafana_dashboard.py -- edit there, not here. The
  # queries read the JSON record in `line` with JSONExtract*; field names are
  # the ones audit.py and diagnostics.py emit.
  vultr-mcp-audit.json: |
    {
      "uid": "vultr-mcp-audit",
      "title": "vultr-mcp audit",
      "description": "",
      "tags": [
        "vultr-mcp"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Tool calls",
          "description": "",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT count() AS calls FROM vultr_mcp.log_mcp_tool_call WHERE $__timeFilter(timestamp)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error rate",
          "description": "Share of tool calls whose outcome was not ok, including errors Vultr returned (401, 404, ...).",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT round(100 * countIf(JSONExtractString(line, 'outcome') != 'ok') / greatest(count(), 1), 1) AS error_rate FROM vultr_mcp.log_mcp_tool_call WHERE $__timeFilter(timestamp)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 duration",
          "description": "Whole tool call, as the caller waited for it.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT round(quantile(0.95)(JSONExtractFloat(line, 'duration_ms'))) AS p95 FROM vultr_mcp.log_mcp_tool_call WHERE $__timeFilter(timestamp)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Accounts",
          "description": "Distinct Vultr accounts (acctid) that made a call. API-key callers carry no acctid.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT uniqExactIf(JSONExtractRaw(line, 'acctid'), JSONHas(line, 'acctid')) AS accounts FROM vultr_mcp.log_mcp_tool_call WHERE $__timeFilter(timestamp)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Tool calls by outcome",
          "description": "",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 0,
              "queryType": "timeseries",
              "rawSql": "SELECT $__timeInterval(timestamp) AS time, JSONExtractString(line, 'outcome') AS outcome, count() AS calls FROM vultr_mcp.log_mcp_tool_call WHERE $__timeFilter(timestamp) GROUP BY time, outcome ORDER BY time"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 70,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Duration",
          "description": "overhead is time spent in this server rather than waiting on the Vultr API. A rising overhead is ours to explain.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 0,
              "queryType": "timeseries",
              "rawSql": "SELECT $__timeInterval(timestamp) AS time, quantile(0.5)(JSONExtractFloat(line, 'duration_ms')) AS p50_total, quantile(0.95)(JSONExtractFloat(line, 'duration_ms')) AS p95_total, quantileIf(0.95)(JSONExtractFloat(line, 'overhead_ms'), JSONHas(line, 'overhead_ms')) AS p95_overhead FROM vultr_mcp.log_mcp_tool_call WHERE $__timeFilter(timestamp) GROUP BY time ORDER BY time"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Tools",
          "description": "",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT JSONExtractString(line, 'tool') AS tool, count() AS calls, countIf(JSONExtractString(line, 'outcome') != 'ok') AS errors, round(quantile(0.5)(JSONExtractFloat(line, 'duration_ms'))) AS p50_ms, round(quantile(0.95)(JSONExtractFloat(line, 'duration_ms'))) AS p95_ms, round(avg(JSONExtractFloat(line, 'upstream_calls')), 1) AS avg_upstream_calls FROM vultr_mcp.log_mcp_tool_call WHERE $__timeFilter(timestamp) GROUP BY tool ORDER BY calls DESC LIMIT 50"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Upstream responses by status class",
          "description": "Every call this server made to the Vultr API. 'no response' is a connection failure or timeout.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 0,
              "queryType": "timeseries",
              "rawSql": "SELECT $__timeInterval(timestamp) AS time, if(JSONHas(line, 'status'), concat(toString(intDiv(JSONExtractInt(line, 'status'), 100)), 'xx'), 'no response') AS status, count() AS responses FROM vultr_mcp.log_mcp_upstream_call WHERE $__timeFilter(timestamp) GROUP BY time, status ORDER BY time"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 70,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Failed tool calls",
          "description": "fault: upstream = Vultr erred, auth = bad or missing credential, request = the call was invalid, unreachable = no response, caller = an argument the tool does not have (the agent's mistake), mcp = this server. Match request_id against Upstream errors for the API's own message.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 24,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT timestamp AS time, JSONExtractString(line, 'tool') AS tool, JSONExtractString(line, 'fault') AS fault, JSONExtractString(line, 'error_type') AS error_type, JSONExtractInt(line, 'upstream_status') AS upstream_status, trim(BOTH '\"' FROM JSONExtractRaw(line, 'acctid')) AS acctid, JSONExtractString(line, 'pod') AS pod, JSONExtractString(line, 'request_id') AS request_id FROM vultr_mcp.log_mcp_tool_call WHERE $__timeFilter(timestamp) AND JSONExtractString(line, 'outcome') != 'ok' ORDER BY timestamp DESC LIMIT 200"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 10,
          "type": "table",
          "title": "Upstream errors",
          "description": "The Vultr API's own error body for each non-2xx response.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 0,
            "y": 31,
            "w": 14,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT timestamp AS time, JSONExtractString(line, 'tool') AS tool, JSONExtractString(line, 'method') AS method, JSONExtractString(line, 'path') AS path, JSONExtractInt(line, 'status') AS status, JSONExtractString(line, 'upstream_error') AS upstream_error, JSONExtractString(line, 'request_id') AS request_id FROM vultr_mcp.log_mcp_upstream_call WHERE $__timeFilter(timestamp) AND (JSONExtractInt(line, 'status') >= 400 OR NOT JSONHas(line, 'status')) ORDER BY timestamp DESC LIMIT 200"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 11,
          "type": "table",
          "title": "Slowest upstream endpoints",
          "description": "path is the API's path template, so IDs do not split one endpoint into many rows.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 14,
            "y": 31,
            "w": 10,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT JSONExtractString(line, 'method') AS method, JSONExtractString(line, 'path') AS path, count() AS calls, round(quantile(0.95)(JSONExtractFloat(line, 'duration_ms'))) AS p95_ms, countIf(JSONExtractInt(line, 'status') >= 500) AS server_errors FROM vultr_mcp.log_mcp_upstream_call WHERE $__timeFilter(timestamp) GROUP BY method, path ORDER BY p95_ms DESC LIMIT 50"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 12,
          "type": "table",
          "title": "Arguments the tools don't have",
          "description": "Calls refused because an argument name is not one the tool has. The error named the right parameter, so this is usually one retry. A name that recurs across clients is a naming problem.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 0,
            "y": 41,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT JSONExtractString(line, 'tool') AS tool, JSONExtractString(line, 'argument_names') AS arguments_passed, count() AS refused, uniqExact(JSONExtractString(line, 'mcp_client_id')) AS clients, max(timestamp) AS last_seen FROM vultr_mcp.log_mcp_tool_call WHERE $__timeFilter(timestamp) AND has(JSONExtract(line, 'error_chain', 'Array(String)'), 'ArgumentError') GROUP BY tool, arguments_passed ORDER BY refused DESC LIMIT 50"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
  vultr-mcp-eval-tickets.json: |
    {
      "uid": "vultr-mcp-eval-tickets",
      "title": "vultr-mcp eval tickets",
      "description": "The eval harness tickets, each against the upstream calls it is about.",
      "tags": [
        "vultr-mcp"
      ],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "1m",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "All ticketed endpoints",
          "description": "One row per endpoint named in a ticket. ok_pct is the share of 2xx answers from the Vultr API.",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
              "format": 1,
              "queryType": "table",
              "rawSql": "SELECT JSONExtractString(line, 'path') AS path, count() AS calls, countIf(JSONExtractInt(line, 'status') BETWEEN 200 AND 299) AS ok, round(100 * ok / greatest(calls, 1), 1) AS ok_pct, max(timestamp) AS last_call, argMaxIf(JSONExtractString(line, 'upstream_error'), timestamp, JSONExtractInt(line, 'status') >= 400) AS latest_vultr_error FROM vultr_mcp.log_mcp_upstream_call WHERE $__timeFilter(timestamp) AND ((JSONExtractString(line, 'path') LIKE '/v2/instances/%/upgrades') OR ((JSONExtractString(line, 'path') LIKE '/v2/instances/%/vpcs' OR JSONExtractString(line, 'path') LIKE '/v2/instances/%/private-networks')) OR (JSONExtractString(line, 'path') LIKE '/v2/kubernetes/clusters/%/resources') OR ((JSONExtractString(line, 'path') LIKE '/v2/instances/%/ipv4' OR JSONExtractString(line, 'path') LIKE '/v2/instances/%/ipv6')) OR JSONExtractString(line, 'path') LIKE '/v2/instances/%/bandwidth') GROUP BY path ORDER BY path"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          }
        },
        {
          "id": 2,
          "type": "row",
          "title": "RND-165 \u2014 instance upgrades: 500",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 3,
          "type": "text",
          "title": "The ticket",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 6,
            "h": 8
          },
          "options": {
            "mode": "markdown",
            "content": "**Filed:** `vultr_compute_instances_upgrades_get` (`type=plans`) returns 500.\n\n**Resolved when** the chart beside this shows only 2xx. The table shows Vultr's own message for each failure; `Error loading upgrade options.` is the API's text, not ours.\n\nThe `type` argument is not recorded, so the chart cannot split plans from other types."
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Vultr's answers",
          "description": "",
          "datasource": {
            "type": "grafana-clickhouse-datasource",
            "uid": "clickhouse-vultr-mcp"
          },
          "gridPos": {
            "x": 6,
            "y": 8,
            "w": 9,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-clickhouse-datasource",
                "uid": "clickhouse-vultr-mcp"
              },
              "editorType": "sql",
