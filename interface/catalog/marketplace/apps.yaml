product_area: marketplace
family: marketplace

# The marketplace area is split across this directory; every file here declares
# the same product_area, and interface.yaml lists them together.

# Browsing the marketplace: the apps anyone can deploy, and how they are
# classified.

declined:
  list-marketplace-app-variables:
    reason: >-
      Marked deprecated in the spec. GET /applications/{image-id}/variables is
      the current operation for the same question and is served here as
      vultr_catalog_application_variables_list, returning the same name,
      description and required fields.

tools:
  - name: vultr_marketplace_apps_list
    access: read
    enabled: true

    description: |
      Lists the applications published to the Vultr marketplace, each with its
      name, description, categories, minimum CPU and memory, which product
      types it can deploy on, and its support and repository links.

      Use this tool to browse or search published marketplace apps, or to check
      what an app requires before deploying it.

      Do not use this tool to find an application to deploy on an instance,
      which vultr_catalog_applications_list answers with the IDs the deploy
      operations take. This tool does not return app readmes or install
      instructions; vultr_marketplace_apps_get does.

    operation: list-marketplace-apps

    input:
      type: object
      properties:
        # GET /marketplace/apps declares no parameters, so every search below
        # is applied here against the fetched rows.
        name:
          type: string
          description: Case-insensitive text contained in the application name.
          filter:
            field: name
            match: contains_ci

        public:
          type: boolean
          description: Whether the application is publicly listed.
          filter:
            field: public
            match: equals

    output:
      from_openapi: true
      # readme and instructions are deliberately absent; see the note at the
      # top of this file.
      include:
        - id
        - name
        - name_id_format
        - description
        - categories
        - os
        - min_cpu_core
        - min_mem_mb
        - deployable_on_vps
        - deployable_on_bm
        - deployable_on_gpu_compute
        - deployable_on_gpu_workstation
        - public
        - public_url_slug
        - website_url
        - repo_url
        - support_url
        - support_email

  - name: vultr_marketplace_apps_get
    access: read
    enabled: true

    description: |
      Gets one published Vultr marketplace application by its ID, including its
      readme and install instructions along with its categories, requirements,
      deployment targets and support links.

      Use this tool when an app ID is already known and its documentation or
      full detail is wanted. To browse apps, use vultr_marketplace_apps_list.

      Do not use this tool to deploy the app; the ID the deploy operations take
      comes from vultr_catalog_applications_list.

    operation: get-marketplace-app

    input:
      type: object
      required:
        - app_id
      properties:
        app_id:
          type: string
          description: >-
            ID of the marketplace application, as returned in the id field by
            vultr_marketplace_apps_list.
          maps_to: app-id

    output:
      from_openapi: true
      include:
        - id
        - name
        - name_id_format
        - description
        - readme
        - instructions
        - categories
        - os
        - min_cpu_core
        - min_mem_mb
        - deployable_on_vps
        - deployable_on_bm
        - deployable_on_gpu_compute
        - deployable_on_gpu_workstation
        - public
        - public_url_slug
        - website_url
        - repo_url
        - support_url
        - support_email
        - discord_invite_url
        - slack_url
        - stackoverflow_url
        - x_handle
        - icon_light
        - icon_dark

  - name: vultr_marketplace_app_categories_list
    access: read
    enabled: true

    description: |
      Lists the categories Vultr marketplace applications are grouped under,
      each with its ID and name.

      Use this tool to find the valid category values before filtering or
      reporting on marketplace apps.

      Do not use this tool for the categories of one specific app, which are on
      the app itself from vultr_marketplace_apps_get.

    operation: list-marketplace-apps-categories

    input:
      type: object
      properties: {}

    output:
      from_openapi: true
      include:
        - id
        - name

  - name: vultr_marketplace_app_operating_systems_list
    access: read
    enabled: true

    description: |
      Lists the operating systems a Vultr marketplace application can be built
      on, each with its name, family and CPU architecture.

      Use this tool when publishing or inspecting a marketplace app, to find
      which base images are supported.

      Do not use this tool for the operating systems available when deploying
      an instance, which is the longer list from
      vultr_catalog_operating_systems_list.

    operation: list-marketplace-apps-os

    input:
      type: object
      properties:
        family:
          type: string
          description: >-
            Operating system family as the API reports it, such as ubuntu or
            debian.
          filter:
            field: family
            match: equals

        page_size:
          type: integer
          description: >-
            Maximum number of results to return. When a filter is supplied the
            server scans the list and returns up to this many matches,
            reporting in meta.filtered how much it scanned.
          default: 100
          minimum: 1
          maximum: 500
          maps_to: per_page

        cursor:
          type: string
          description: Cursor returned by a previous request for the next page.

    output:
      from_openapi: true
      include:
        - id
        - name
        - family
        - arch
        - meta
