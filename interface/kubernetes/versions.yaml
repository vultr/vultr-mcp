product_area: kubernetes
family: kubernetes

# One file of the kubernetes area, which interface.yaml lists across this directory.

# Account-wide reference data: the Kubernetes versions VKE will deploy.

tools:
  - name: vultr_kubernetes_versions_list
    access: read
    enabled: true

    description: |
      Lists the Kubernetes versions Vultr Kubernetes Engine supports for new
      clusters.

      Use this tool to find which versions can be deployed before creating a
      cluster.

      Do not use this tool for the versions one existing cluster can upgrade
      to, which vultr_kubernetes_clusters_upgrades_get returns, or for managed
      database engine versions, which are a different product.

    operation: get-kubernetes-versions

    input:
      type: object
      properties: {}

    # No `output` block: a bare array of version strings.
