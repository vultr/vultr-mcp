product_area: baremetal
family: compute

# Bare Metal is the product instances descriptions keep disclaiming, so the two
# files have to be read together: each says plainly what it is not, and the
# names differ at the resource segment rather than only in prose.
#
# default_password is withheld from both tools here for the same reason it is
# withheld from instances -- it is a real credential, live for a window after
# deployment, and no question about a server needs it.
#
# The console link is deliberately left alone. On instances it is the `kvm`
# field, volunteered on every row of every listing whether or not anyone asked,
# which is why that one is shaped out. Here it is get-bare-metal-vnc, a separate
# operation whose entire output is the URL: an agent reaches it only by deciding
# to, and a tool that returned it with the URL removed would be pointless.
# Different exposure, different answer.
#
# get-bare-metal-userdata gets the same treatment for the same reason. User data
# often carries bootstrap secrets, but it is its own operation returning one
# field, and a tool that withheld that field would have nothing left to return.
# Declining it would not have hidden anything either: a declined operation keeps
# its generated tool, so the choice was only ever between a good description and
# a generated one.
#
# list-baremetal-vpcs was declined here on the grounds that the VPCs area would
# cover attachment "from the network side". That claim was checked and does not
# hold. GET /vpcs/{vpc-id}/attachments answers "what is attached to this VPC";
# nothing answers "which VPCs is this server in" except this operation, short of
# enumerating every VPC in the account. It is the same error as the ipv4 and
# ipv6 declines above, in the same shape: a decline resting on another tool
# returning the data, when that other tool only returns it in the other
# direction.

tools:
  - name: vultr_compute_baremetal_list
    access: read
    enabled: true

    description: |
      Lists Vultr Bare Metal servers, dedicated physical machines, in the
      active Vultr organization.

      Use this tool to list, find, count, or select bare metal servers, and to
      answer questions about their power state, region, plan, or operating
      system.

      Do not use this tool for Vultr cloud compute instances, which are virtual
      machines and have their own tools, nor for Vultr Kubernetes Engine nodes
      or Compute Cluster members.

    operation: list-baremetals

    input:
      type: object
      properties:
        # The API filters on these itself: one request, accurate across pages.
        label:
          type: string
          description: >-
            Exact server label. The API filters on this directly, so prefer it
            when the full label is known.

        main_ip:
          type: string
          description: Main IPv4 address of the server.

        region:
          type: string
          description: Vultr region ID, such as ewr.

        # The API cannot filter on these, so the server does, which makes the
        # call scan the account instead of fetching one page.
        label_contains:
          type: string
          description: >-
            Case-insensitive text contained in the server label, for finding
            servers by part of a name. Slower than label.
          filter:
            field: label
            match: contains_ci

        power_status:
          type: string
          description: Whether the server is powered on.
          enum:
            - running
            - stopped
          filter:
            field: power_status
            match: equals

        plan:
          type: string
          description: Vultr bare metal plan ID, such as vbm-4c-32gb.
          filter:
            field: plan
            match: equals

        page_size:
          type: integer
          description: >-
            Maximum number of results to return. When label_contains,
            power_status, or plan is supplied, the server scans the account and
            returns up to this many matches, reporting in meta.filtered how
            much it scanned.
          default: 100
          minimum: 1
          maximum: 500
          maps_to: per_page

        cursor:
          type: string
          description: Cursor returned by a previous request for the next page.

    output:
      from_openapi: true
      # default_password is absent deliberately. Everything the agent can filter
      # on is present, so it can see what it selected by.
      include:
        - id
        - label
        - region
        - plan
        - status
        - power_status
        - main_ip
        - os
        - cpu_count
        - ram
        - disk
        - tags
        - date_created
        - meta

    computed:
      display_name:
        type: string
        description: >-
          Label if the server has one, otherwise its main IP address. Bare
          metal servers are often deployed without a label.
        from: coalesce(label, main_ip)

  - name: vultr_compute_baremetal_get
    access: read
    enabled: true

    description: |
      Gets one Vultr Bare Metal server by its ID, including its plan, operating
      system, IPv4 and IPv6 addressing, MAC address, region, and power state.

      Use this tool when a server ID is already known. To find one by label,
      IP, or region, use vultr_compute_baremetal_list first.

      Do not use this tool for Vultr cloud compute instances, which are virtual
      machines with their own tools.

    operation: get-baremetal

    input:
      type: object
      required:
        - baremetal_id
      properties:
        baremetal_id:
          type: string
          description: >-
            ID of the bare metal server, as returned in the id field by
            vultr_compute_baremetal_list.
          maps_to: baremetal-id

    output:
      from_openapi: true
      # A single server is cheap to return in full, so this keeps the network
      # and image detail the list drops -- everything except default_password.
      # Note the IPv6 fields here are the flat ones the API actually sends;
      # the instance schema documents a v6_networks array instead and never
      # sends it, which is a spec bug on that side rather than this one.
      include:
        - id
        - label
        - region
        - plan
        - status
        - power_status
        - main_ip
        - netmask_v4
        - gateway_v4
        - internal_ip
        - mac_address
        - v6_main_ip
        - v6_network
        - v6_network_size
        - os
        - os_id
        - app_id
        - image_id
        - snapshot_id
        - cpu_count
        - ram
        - disk
        - tags
        - user_scheme
        - vpcs
        - date_created

  - name: vultr_compute_baremetal_ipv4_list
    access: read
    enabled: true

    description: |
      Lists every IPv4 address assigned to one Vultr Bare Metal server, with
      each address's netmask, gateway, MAC address, reverse DNS entry, and
      whether it is the main address or an additional one.

      Use this tool when a server has more than one address, or when the
      netmask, gateway, MAC or reverse DNS is needed.
      vultr_compute_baremetal_get returns only the main address.

      Do not use this tool for cloud compute instances, which have their own
      tool, or for reserved IPs that are not yet attached to a server.

    operation: get-ipv4-baremetal

    input:
      type: object
      required:
        - baremetal_id
      properties:
        baremetal_id:
          type: string
          description: >-
            ID of the bare metal server, as returned in the id field by
            vultr_compute_baremetal_list.
          maps_to: baremetal-id

    output:
      from_openapi: true
      include:
        - ip
        - netmask
        - gateway
        - type
        - reverse
        - mac_address
        - meta

  - name: vultr_compute_baremetal_ipv6_list
    access: read
    enabled: true

    description: |
      Lists every IPv6 address assigned to one Vultr Bare Metal server, with
      each address's network and prefix size.

      Use this tool to report a server's IPv6 configuration or to check whether
      IPv6 is assigned at all.

      Do not use this tool for IPv4 addresses, which
      vultr_compute_baremetal_ipv4_list returns, or for cloud compute
      instances, which have their own tool.

    operation: get-ipv6-baremetal

    input:
      type: object
      required:
        - baremetal_id
      properties:
        baremetal_id:
          type: string
          description: >-
            ID of the bare metal server, as returned in the id field by
            vultr_compute_baremetal_list.
          maps_to: baremetal-id

    output:
      from_openapi: true
      include:
        - ip
        - network
        - network_size
        - type
        - meta

  - name: vultr_compute_baremetal_bandwidth_get
    access: read
    enabled: true

    description: |
      Gets daily bandwidth usage for one Vultr Bare Metal server, as incoming
      and outgoing bytes per day.

      Use this tool to report how much traffic a specific server has moved, or
      to find which day drove a spike.

      Do not use this tool for account-wide bandwidth across every product,
      which vultr_account_bandwidth_get returns, or for cloud compute
      instances, which have their own tool.

    operation: get-bandwidth-baremetal

    input:
      type: object
      required:
        - baremetal_id
      properties:
        baremetal_id:
          type: string
          description: >-
            ID of the bare metal server, as returned in the id field by
            vultr_compute_baremetal_list.
          maps_to: baremetal-id

    # No `output` block. The response is a map with one key per day, and the
    # spec models it by hard-coding two example dates -- 2020-10-10 and
    # 2020-10-11 -- as literal property names. Allowlisting against those would
    # filter every real response down to nothing.

  - name: vultr_compute_baremetal_upgrades_get
    access: read
    enabled: true

    description: |
      Gets the operating systems and marketplace applications one Vultr Bare
      Metal server can be upgraded or changed to.

      Use this tool to find out what a specific server can move to before
      planning an OS change or application switch.

      Do not use this tool for the server's current operating system, which
      vultr_compute_baremetal_get returns, or to browse the marketplace and OS
      catalogs in general, which are not specific to one server.

    operation: get-bare-metals-upgrades

    input:
      type: object
      required:
        - baremetal_id
      properties:
        baremetal_id:
          type: string
          description: >-
            ID of the bare metal server, as returned in the id field by
            vultr_compute_baremetal_list.
          maps_to: baremetal-id

        type:
          type: string
          description: >-
            Limit the answer to one kind of upgrade. Omit for everything
            available.
          # The spec leaves this a bare string and names the three values only
          # in prose; stating them as an enum is what stops an agent guessing.
          enum:
            - all
            - applications
            - os

    output:
      from_openapi: true
      include:
        - os
        - applications

  - name: vultr_compute_baremetal_userdata_get
    access: read
    enabled: true

    description: |
      Gets the user data configured for one Vultr Bare Metal server -- the
      cloud-init or startup configuration supplied at deployment -- returned
      base64-encoded.

      Use this tool to inspect or reproduce how a server was configured at
      first boot.

      Do not use this tool for startup scripts, which are a separate Vultr
      resource with their own tools, or for cloud compute instances, which have
      their own tool.

    operation: get-bare-metal-userdata

    input:
      type: object
      required:
        - baremetal_id
      properties:
        baremetal_id:
          type: string
          description: >-
            ID of the bare metal server, as returned in the id field by
            vultr_compute_baremetal_list.
          maps_to: baremetal-id

    output:
      from_openapi: true
      include:
        - data

  - name: vultr_compute_baremetal_vnc_get
    access: read
    enabled: true

    description: |
      Gets the VNC console URL for one Vultr Bare Metal server, giving
      out-of-band access to the machine's screen and keyboard.

      Use this tool when someone asks for console or out-of-band access to a
      specific server, typically because it is unreachable over the network.

      Do not use this tool for ordinary status checks, which
      vultr_compute_baremetal_get answers, or for cloud compute instances,
      whose console link is a different field on a different tool.

    operation: get-bare-metal-vnc

    input:
      type: object
      required:
        - baremetal_id
      properties:
        baremetal_id:
          type: string
          description: >-
            ID of the bare metal server, as returned in the id field by
            vultr_compute_baremetal_list.
          maps_to: baremetal-id

    output:
      from_openapi: true
      # The URL is the entire point of the operation; see the note at the top
      # of this file on why the console link is shaped out of listings but kept
      # here.
      include:
        - url

  - name: vultr_compute_baremetal_vpcs_list
    access: read
    enabled: true

    description: |
      Lists the VPCs one Vultr Bare Metal server is attached to, with the
      server's private IP address and MAC address on each.

      Use this tool to find which private networks a specific server reaches,
      or its address inside one.

      Do not use this tool to list VPCs in general, or to see everything
      attached to a given VPC, which are answered from the VPC side.

    operation: list-baremetal-vpcs

    input:
      type: object
      required:
        - baremetal_id
      properties:
        baremetal_id:
          type: string
          description: >-
            ID of the bare metal server, as returned in the id field by
            vultr_compute_baremetal_list.
          maps_to: baremetal-id

    output:
      from_openapi: true
      include:
        - id
        - ip_address
        - mac_address
