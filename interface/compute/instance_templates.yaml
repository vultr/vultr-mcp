product_area: instance_templates
family: compute

# The deployment recipes Compute Clusters build nodes from; `ssh_keys` holds IDs and names, not key material.
# `include_all` shows the ephemeral templates clusters create for their head nodes.

tools:
  - name: vultr_compute_instance_templates_list
    access: read
    enabled: true

    description: |
      Lists Vultr instance templates in the active Vultr organization -- saved
      deployment recipes naming a plan, operating system or marketplace app,
      SSH keys, startup script and user data.

      Use this tool to find a template before deploying from it, or to resolve
      the template a Compute Cluster builds its nodes from.

      Do not use this tool for the instances themselves, which
      vultr_compute_instances_list returns, or for snapshots, which are disk
      images rather than deployment recipes.

    operation: list-instance-templates

    input:
      type: object
      properties:
        include_all:
          type: boolean
          description: >-
            Include ephemeral templates that Compute Clusters create for their
            own nodes. These are hidden by default, which makes a cluster look
            like it references a template that does not exist.

        label:
          type: string
          description: Case-insensitive text contained in the template label.
          filter:
            field: label
            match: contains_ci

    output:
      from_openapi: true
      include:
        - id
        - label
        - plan
        - os
        - marketplace_app
        - marketplace_image
        - snapshot
        - iso
        - ssh_keys
        - startup_script
        - user_data
        - disk_config
        - ephemeral

  - name: vultr_compute_instance_templates_get
    access: read
    enabled: true

    description: |
      Gets one Vultr instance template by its ID, with its plan and plan
      details, operating system or marketplace app, SSH keys, startup script,
      user data and disk configuration.

      Use this tool when a template ID is already known. To find one, use
      vultr_compute_instance_templates_list first.

      Do not use this tool for an instance deployed from the template, which
      vultr_compute_instances_get returns.

    operation: get-instance-template

    input:
      type: object
      required:
        - instancetemplate_id
      properties:
        instancetemplate_id:
          type: string
          description: >-
            ID of the instance template, as returned in the id field by
            vultr_compute_instance_templates_list.
          maps_to: instancetemplate-id

    output:
      from_openapi: true
      include:
        - id
        - label
        - plan
        - plan_details
        - os
        - marketplace_app
        - marketplace_image
        - snapshot
        - iso
        - ssh_keys
        - startup_script
        - user_data
        - disk_config
        - ephemeral
