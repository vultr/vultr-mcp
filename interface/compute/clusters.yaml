product_area: clusters
family: compute

tools:
  - name: vultr_compute_clusters_list
    access: read
    enabled: true

    description: |
      Lists Vultr Compute Clusters in the active Vultr organization.

      Use this tool to list, find, count, or select Compute Clusters, including
      GPU and fabric-connected clusters. Results can be filtered by label,
      region, plan, status, state, or cluster type.

      Do not use this tool for Vultr Kubernetes Engine clusters or Object
      Storage clusters.

    operation: list-clusters

    input:
      type: object
      properties:
        label:
          type: string
          description: Case-insensitive text contained in the cluster label.
          filter:
            field: label
            match: contains_ci

        region:
          type: string
          description: Vultr region ID, such as ewr.
          filter:
            field: region
            match: equals

        plan:
          type: string
          description: Vultr plan ID used by the cluster.
          filter:
            field: plan
            match: equals

        status:
          type: string
          description: Cluster subscription or provisioning status.
          filter:
            field: status
            match: equals

        state:
          type: string
          description: Cluster operational state.
          filter:
            field: state
            match: equals

        cluster_type:
          type: string
          description: >-
            Kind of Compute Cluster, as the API reports it, such as fabric.
            Not the same as the type field, which says whether a result is a
            Compute Cluster or a VKE cluster.
          filter:
            field: cluster_type
            match: equals

        page_size:
          type: integer
          description: >-
            Maximum number of results to return. When a search filter is
            supplied, the server scans the account and returns up to this many
            matches, reporting in meta.filtered how much it scanned.
          default: 100
          minimum: 1
          maximum: 500
          maps_to: per_page

        cursor:
          type: string
          description: Cursor returned by a previous request for the next page.

    output:
      from_openapi: true
      include:
        - id
        - label
        - region
        - plan
        - type
        - cluster_type
        - status
        - state
        - min_pool_count
        - desired_pool_count
        - instances
        - date_created
        - meta

    computed:
      instance_count:
        type: integer
        description: Number of instances associated with the cluster.
        from: length(instances)

  - name: vultr_compute_clusters_get
    access: read
    enabled: true

    description: |
      Gets one Vultr Compute Cluster by its ID: its region, plan, pool counts,
      status and state, the instance template its nodes are built from, and the
      instances currently in it.

      Use this tool when a cluster ID is already known. To find one, use
      vultr_compute_clusters_list first.

      Do not use this tool for Vultr Kubernetes Engine clusters, which have
      their own tools, or for Object Storage clusters. The type field says which
      kind of cluster a result is.

    operation: get-cluster

    input:
      type: object
      required:
        - cluster_id
      properties:
        cluster_id:
          type: string
          description: >-
            ID of the Compute Cluster, as returned in the id field by
            vultr_compute_clusters_list.
          maps_to: cluster-id

    output:
      from_openapi: true
      include:
        - id
        - label
        - hostname
        - region
        - plan
        - type
        - cluster_type
        - status
        - state
        - min_pool_count
        - desired_pool_count
        - head_node_instance_template_id
        - instance_template
        - instances
        - vpc_networks
        - vfs
        - date_created

    computed:
      instance_count:
        type: integer
        description: Number of instances currently in the cluster.
        from: length(instances)

  - name: vultr_compute_clusters_availability_get
    access: read
    enabled: true

    description: |
      Gets the regions where one Compute Cluster plan is available, separating
      regions that support GPU fabric from those that do not.

      Use this tool when a plan ID is already known and the question is where
      that specific plan can be deployed.

      Do not use this tool to list Vultr regions in general, or to check
      availability of plans outside Compute Clusters.

    operation: get-cluster-availability-by-plan

    input:
      type: object
      required:
        - plan_id
      properties:
        plan_id:
          type: string
          description: >-
            ID of the Compute Cluster plan, as returned by
            vultr_compute_cluster_availability_list.
          maps_to: plan-id

    # No `output` block: the response is two sibling arrays, locations and
    # fabric_locations, and shaping applies to only one container. Both are
    # short lists of region IDs with nothing worth trimming or withholding, so
    # the whole payload is passed through rather than claiming a shape the
    # layer cannot honour.

  - name: vultr_compute_clusters_metrics_get
    access: read
    enabled: true

    description: |
      Gets time-series performance metrics for one Compute Cluster, per
      instance: GPU temperature, utilization, memory and power, and fabric
      throughput where the cluster has a GPU fabric.

      Use this tool to report on cluster load, GPU usage, or thermal and power
      behaviour over a period.

      Do not use this tool for the cluster's configuration or node list, which
      vultr_compute_clusters_get returns, or for account bandwidth usage.

    operation: get-cluster-metrics

    input:
      type: object
      required:
        - cluster_id
      properties:
        cluster_id:
          type: string
          description: >-
            ID of the Compute Cluster, as returned in the id field by
            vultr_compute_clusters_list.
          maps_to: cluster-id

        period:
          type: string
          description: >-
            Time period the metrics cover, such as -1days or -7days. Defaults
            to -1days.

    output:
      # metrics.instances is a map keyed by instance ID, so there are no item
      # fields to allowlist against.
      from_openapi: true

declined:
  get-cluster-availability:
    reason: >-
      GET /clusters/availability requires a JSON request body with a required
      `region` field -- the spec says so in prose and declares the requestBody
      -- and the interface runtime does not build request bodies yet, so the
      validator rejects any tool for it. Revisit when the request-body engine
      lands; until then the generated tool remains the only way to reach it.
