product_area: startup
family: compute

# Neither tool returns `script`. A startup script is arbitrary shell run as root
# at first boot, and in practice it is where people put the token that registers
# a node, the password that joins a cluster, the key that pulls a private image.
#
# The by-id get used to return the body, on the reasoning that asking for one
# script is a deliberate act. That changed on 2026-09-28 with the rule this
# server now follows: it gives an agent information, never a credential it
# could act with. The same decision excluded user data, the VNC console and the
# kubeconfig. Names, types and dates stay; the body is read in the Vultr console.

tools:
  - name: vultr_compute_startup_scripts_list
    access: read
    enabled: true

    description: |
      Lists Vultr startup scripts in the active Vultr organization, with each
      one's name, type, and when it was created and last modified.

      Use this tool to find what startup scripts exist, or to resolve a script
      ID to a name. No tool returns script bodies, because they routinely hold
      tokens and passwords; the body is read in the Vultr console.

      Do not use this tool for an instance's user data, which this server does
      not return, or for marketplace application variables.

    operation: list-startup-scripts

    input:
      type: object
      properties:
        name:
          type: string
          description: Case-insensitive text contained in the script name.
          filter:
            field: name
            match: contains_ci

        type:
          type: string
          description: >-
            Kind of startup script: boot runs at every boot, pxe runs at
            network boot.
          enum:
            - boot
            - pxe
          filter:
            field: type
            match: equals

        page_size:
          type: integer
          description: >-
            Maximum number of results to return. When a filter is supplied the
            server scans the account and returns up to this many matches,
            reporting in meta.filtered how much it scanned.
          default: 100
          minimum: 1
          maximum: 500
          maps_to: per_page

        cursor:
          type: string
          description: Cursor returned by a previous request for the next page.

    output:
      from_openapi: true
      # `script` is deliberately absent; see the note at the top of this file.
      include:
        - id
        - name
        - type
        - date_created
        - date_modified
        - meta

  - name: vultr_compute_startup_scripts_get
    access: read
    enabled: true

    description: |
      Gets one Vultr startup script by its ID, with its name, its type, and
      when it was created and last modified. It does not return the script
      body, because startup scripts routinely hold tokens and passwords; the
      body is read in the Vultr console.

      Use this tool when a script ID is already known. To find one, or to survey
      the scripts an account has, use vultr_compute_startup_scripts_list.

    operation: get-startup-script

    input:
      type: object
      required:
        - startup_id
      properties:
        startup_id:
          type: string
          description: >-
            ID of the startup script, as returned in the id field by
            vultr_compute_startup_scripts_list.
          maps_to: startup-id

    output:
      from_openapi: true
      # `script` is deliberately absent; see the note at the top of this file.
      include:
        - id
        - name
        - type
        - date_created
        - date_modified
