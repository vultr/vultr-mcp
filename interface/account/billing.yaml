product_area: billing
family: account

# Billing reads money out of the account: history, invoices, and charges not yet
# invoiced. Nothing here carries a payment instrument -- no card, no bank
# detail, no billing address -- which is worth stating because it is the kind of
# area where that assumption should be checked rather than assumed. The API
# exposes amounts and descriptions only.
#
# The spec has the wrong schema attached to pending-charges, and it is a mix-up
# rather than a missing field. It declares the billing-history shape -- id, date,
# type, description, amount, balance, the same six as GET /billing/history.
# Production returns the invoice-item shape instead: product, unit_type,
# unit_price, units, total, start_date, end_date, description. Confirmed
# 2026-09-02.
#
# So pending charges are uninvoiced *line items*, priced per unit, and not
# account-level charge entries at all. The description says so.
#
# Its tool can carry no allowlist, and that is forced rather than chosen:
# `include` is resolved against the declared 200 schema, so naming the fields
# the API really sends would fail the build, and naming the declared ones shaped
# every row to {} -- which is what it did until this was found.
#
# There is no tool for the pending-charges CSV export, and the reason is in the
# excluded block rather than in a comment nobody would find.

excluded:
  pending-charges-csv:
    reason: >-
      The same uninvoiced line items vultr_account_pending_charges_list returns,
      as one CSV document -- 21 MB for a large account on 2026-09-28. It was
      declined at first, on the belief that no tool for it could succeed, but a
      decline leaves the generated tool served, and the generated tool passes
      the CSV through as text. So it was reachable, useless to any agent at that
      size, and held whole in the pod's memory: it was one of the responses in
      flight when a 2.1.11 pod was OOM-killed at its 512 MiB limit. Excluded
      rather than shaped because the JSON tool already carries the data in a
      form that can be filtered and bounded; a CSV adds nothing an agent can use.

tools:
  - name: vultr_account_billing_history_list
    access: read
    enabled: true

    description: |
      Lists billing history for the active Vultr organization -- charges,
      payments and credits -- each with its date, type, description, amount and
      the running balance.

      Use this tool to report what an account has been charged and paid over
      time, or to explain a balance.

      Do not use this tool for charges not yet invoiced, which
      vultr_account_pending_charges_list returns, or for the current balance
      alone, which vultr_account_get returns.

    operation: list-billing-history

    input:
      type: object
      properties:
        # GET /billing/history declares no parameters, so this search is
        # applied here against the fetched rows.
        description:
          type: string
          description: >-
            Case-insensitive text contained in the entry description.
          filter:
            field: description
            match: contains_ci

    output:
      from_openapi: true
      include:
        - id
        - date
        - type
        - description
        - amount
        - balance
        - meta

  - name: vultr_account_invoices_list
    access: read
    enabled: true

    description: |
      Lists invoices issued to the active Vultr organization, each with its
      date, description, amount and the balance at the time.

      Use this tool to find an invoice, or to report what has been invoiced
      over a period.

      Do not use this tool for the line items on an invoice, which
      vultr_account_invoice_items_list returns, or for charges not yet
      invoiced.

    operation: list-invoices

    input:
      type: object
      properties: {}

    output:
      from_openapi: true
      include:
        - id
        - date
        - description
        - amount
        - balance
        - meta

  - name: vultr_account_invoices_get
    access: read
    enabled: true

    description: |
      Gets one Vultr invoice by its ID, with its date, description, amount and
      the balance at the time.

      Use this tool when an invoice ID is already known. To find one, use
      vultr_account_invoices_list first.

      Do not use this tool for the invoice's line items, which
      vultr_account_invoice_items_list returns -- this is the summary only.

    operation: get-invoice

    input:
      type: object
      required:
        - invoice_id
      properties:
        invoice_id:
          type: string
          description: >-
            ID of the invoice, as returned in the id field by
            vultr_account_invoices_list.
          maps_to: invoice-id

    output:
      from_openapi: true
      include:
        - id
        - date
        - description
        - amount
        - balance

  - name: vultr_account_invoice_items_list
    access: read
    enabled: true

    description: |
      Lists the line items on one Vultr invoice, each with its product,
      description, unit price, unit type, quantity, total and the period it
      covers.

      Use this tool to break an invoice down by product, or to explain what
      drove a bill.

      Do not use this tool for the invoice total alone, which
      vultr_account_invoices_get returns, or for charges not yet invoiced.

    operation: get-invoice-items

    input:
      type: object
      required:
        - invoice_id
      properties:
        invoice_id:
          type: string
          description: >-
            ID of the invoice, as returned in the id field by
            vultr_account_invoices_list.
          maps_to: invoice-id

        product:
          type: string
          description: >-
            Case-insensitive text contained in the product name, to narrow a
            long invoice to one product.
          filter:
            field: product
            match: contains_ci

    output:
      from_openapi: true
      include:
        - product
        - description
        - unit_type
        - unit_price
        - units
        - total
        - start_date
        - end_date
        - meta

  - name: vultr_account_pending_charges_list
    access: read
    enabled: true

    description: |
      Lists what the active Vultr organization has accrued since its last
      invoice, as line items: each with its product, unit type, unit price,
      number of units, total, and the period it covers.

      Use this tool to report what the next bill will contain, or to break
      current spend down by product before it is invoiced.

      Do not use this tool for charges already invoiced, which
      vultr_account_invoice_items_list returns in this same line-item shape for
      a given invoice, nor for the account-level ledger of charges and
      payments, which vultr_account_billing_history_list returns.

    operation: pending-charges

    input:
      type: object
      # No description filter. Filtering compares a field on each row, and the
      # rows do not carry the fields the spec says they do -- see the output
      # note below -- so the filter would silently match nothing.
      properties: {}

    # No `output` block. The spec gives each pending charge id, date, type,
    # description, amount and balance. Against production on 2026-09-02 the
    # rows carried none of those six: the container was found and every declared
    # name was absent. Because `include` is an allowlist and nothing matched,
    # the tool was returning one empty object per charge -- five rows of
    # nothing, reported as success. Passing the payload through is correct until
    # the real field names are known; restore an allowlist then.

