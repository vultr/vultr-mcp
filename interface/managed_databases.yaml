product_area: managed_databases
family: database

# The area with the most credentials on the surface. Every database row carried
# `password` and `access_key`, and every user row carried both plus
# `access_cert` -- a TLS client certificate, which authenticates as surely as a
# password does and which the credential heuristic missed until this file was
# written. A migration status carried `credentials` outright.
#
# What is kept is what someone needs to reason about a database: host, port,
# engine, plan, status. What is withheld is everything that would let an agent,
# or anyone reading its transcript, connect as a user. `ca_certificate` is
# withheld too -- it is not a secret, it is a PEM blob nobody asked for.
#
# The reads are all covered now, and covering the connectors turned up a fourth
# credential carrier the earlier audit could not have seen. A Kafka Connect
# connector's `config` holds whatever that connector needs to reach the system
# it integrates with, which for most classes includes a password, an access key
# or a token. The spec declares it as a bare `object` with no properties, so a
# scan for credential-shaped field names finds nothing to flag -- there are no
# field names in the spec to scan. It is withheld from both connector tools,
# under the same rule as `root_user` in the container registry file: `include`
# allowlists the top level of an item and a nested object passes through whole,
# so an object that may hold a secret goes or stays as one piece.
#
# What is left is what identifies a connector -- name, class, topics -- which is
# what questions about connectors actually ask. The settings a connector class
# accepts, as opposed to the values one has been given, are public schema and
# are served by vultr_database_connector_configuration_get.
#
# The resource is called `clusters` because Vultr's own docs do, and because
# vultr_database_clusters_list beside vultr_compute_clusters_list and
# vultr_kubernetes_clusters_list is the family prefix doing exactly the job it
# was added for.

# The one read in this area with no tool, and it is not an oversight.
#
# list-service-alerts is a read: it lists a database's existing alerts and
# creates nothing. server.py already knows that -- READ_ONLY_METHOD_OVERRIDES
# keeps it on the read-only surface despite the verb. But the interface layer
# cannot express it twice over, and neither blocker is ours to remove.
declined:
  list-service-alerts:
    reason: >-
      A read served over POST /databases/{database-id}/alerts. The compiler
      requires `access` to agree with the HTTP method, so a tool for it would
      have to declare `access: write` and would then be dropped from the
      read-only surface -- the opposite of what it is. It also requires a JSON
      request body with a required `period`, which the runtime does not build.
      server.py's READ_ONLY_METHOD_OVERRIDES already exempts it so the generated
      tool stays reachable; revisit when the request-body engine lands and the
      access check can take an override.

tools:
  - name: vultr_database_clusters_list
    access: read
    enabled: true

    description: |
      Lists Vultr Managed Database clusters, also called managed databases, in
      the active Vultr organization, with their engine, plan, region, and
      connection endpoints.

      Use this tool to list, find, count, or select managed databases, and to
      answer questions about which engine or plan a database runs.

      Do not use this tool for Vultr Compute Clusters or Vultr Kubernetes
      Engine clusters, which are unrelated products with their own tools, nor
      for a database you run yourself on an instance.

    operation: list-databases

    input:
      type: object
      properties:
        # The API filters on these itself.
        label:
          type: string
          description: >-
            Exact database label. The API filters on this directly, so prefer
            it when the full label is known.

        tag:
          type: string
          description: Exact tag applied to the database.

        region:
          type: string
          description: Vultr region ID, such as ewr.

        # Applied here, because the API cannot. GET /databases takes no
        # per_page or cursor at all -- it returns the whole account in one
        # response -- so there is no page size to cap matches against and no
        # paging loop to run.
        label_contains:
          type: string
          description: >-
            Case-insensitive text contained in the database label. Slower than
            label, which the API filters directly.
          filter:
            field: label
            match: contains_ci

        database_engine:
          type: string
          description: Database engine, such as pg, mysql, valkey, or kafka.
          filter:
            field: database_engine
            match: equals

        status:
          type: string
          description: Provisioning status of the database.
          filter:
            field: status
            match: equals

    output:
      from_openapi: true
      # password, access_key, access_cert, and ca_certificate are all absent.
      # `user` is the username and stays: it identifies, it does not authorise.
      include:
        - id
        - label
        - region
        - status
        - plan
        - database_engine
        - database_engine_version
        - host
        - public_host
        - port
        - user
        - dbname
        - tag
        - latest_backup
        - pending_charges
        - date_created
        - meta

  - name: vultr_database_clusters_get
    access: read
    enabled: true

    description: |
      Gets one Vultr Managed Database cluster by its ID, including its engine,
      plan sizing, maintenance window, backup schedule, and network access
      rules.

      Use this tool when a database ID is already known. To find one by label,
      tag, or region, use vultr_database_clusters_list first.

      Do not use this tool for Vultr Compute Clusters or Kubernetes clusters.

    operation: get-database

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      # The same credentials are withheld. This view adds the sizing,
      # maintenance, and engine-specific settings the list drops.
      include:
        - id
        - label
        - region
        - status
        - plan
        - plan_disk
        - plan_ram
        - plan_vcpus
        - plan_replicas
        - plan_brokers
        - database_engine
        - database_engine_version
        - host
        - public_host
        - port
        - sasl_port
        - user
        - dbname
        - tag
        - vpc_id
        - trusted_ips
        - read_replicas
        - parent_id
        - latest_backup
        - backup_hour
        - backup_minute
        - maintenance_dow
        - maintenance_time
        - cluster_time_zone
        - eviction_policy
        - redis_eviction_policy
        - enable_kafka_connect
        - enable_kafka_rest
        - enable_schema_registry
        - kafka_rest_uri
        - schema_registry_uri
        - kafka_private_access
        - mysql_require_primary_key
        - mysql_slow_query_log
        - mysql_long_query_time
        - mysql_sql_modes
        - pending_charges
        - date_created

  - name: vultr_database_users_list
    access: read
    enabled: true

    description: |
      Lists the usernames defined on one Vultr Managed Database, with their
      permission level and access control rules where the engine reports them.

      Use this tool to answer who has access to a database. Permission and
      access control detail is engine-dependent and is often absent, in which
      case this returns usernames alone.

      Do not use this tool for Vultr account users or IAM identities, which are
      unrelated and are not exposed through this server.

    operation: list-database-users

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      # password, access_key, and access_cert are absent. What remains answers
      # "who can reach this database and with what rights" without handing over
      # the means to become them.
      include:
        - username
        - permission
        - encryption
        - access_control

  - name: vultr_database_users_get
    access: read
    enabled: true

    description: |
      Gets one database user on a Vultr Managed Database by username, with its
      permission level and access control rules where the engine reports them,
      which is often not at all.

      Use this tool when the username is already known. To list them, use
      vultr_database_users_list.

      Do not use this tool for Vultr account users or IAM identities.

    operation: get-database-user

    input:
      type: object
      required:
        - database_id
        - username
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

        username:
          type: string
          description: >-
            Name of the database user, as returned in the username field by
            vultr_database_users_list.

    output:
      from_openapi: true
      include:
        - username
        - permission
        - encryption
        - access_control

  - name: vultr_database_migration_get
    access: read
    enabled: true

    description: |
      Gets the status of a data migration into one Vultr Managed Database,
      including the method used and any error reported.

      Use this tool to answer whether a migration is running, finished, or
      failed.

      Do not use this tool to start or stop a migration.

    operation: view-migration-status

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      # `credentials` is absent: it holds the source database's connection
      # details, which is somebody else's system's credential rather than
      # Vultr's, and no less real for that.
      include:
        - status
        - method
        - error

  - name: vultr_database_services_list
    access: read
    enabled: true

    description: |
      Lists the database engines Vultr offers as a managed service -- MySQL,
      PostgreSQL, Valkey and Kafka -- with the versions available for each.

      Use this tool to find which engines and versions can be deployed before
      creating a managed database.

      Do not use this tool for the engine a database already runs, which
      vultr_database_clusters_get returns, or for the versions one existing
      database can upgrade to, which vultr_database_versions_list returns.

    operation: available-services

    input:
      type: object
      properties: {}

    # No `output` block. The spec declares the results under `databases`, and
    # against production 2026-09-02 the response carried no such key and no
    # list-valued key at all, so the allowlist never ran. Passing the payload
    # through is correct until the real shape is known.

  - name: vultr_database_plans_list
    access: read
    enabled: true

    description: |
      Lists Vultr Managed Database plans, with each plan's vCPU count, RAM,
      disk, node count, maximum connections, monthly cost, supported engines
      and available regions.

      Use this tool to compare plans, price a managed database before creating
      it, or check which plans exist in a region or for an engine.

      Do not use this tool for compute instance or bare metal plans, which are
      a different product, or for the plan a database already runs on, which
      vultr_database_clusters_get returns.

    operation: list-database-plans

    input:
      type: object
      properties:
        engine:
          type: string
          description: Limit results to plans supporting one database engine.
          enum:
            - mysql
            - pg
            - valkey
            - kafka

        nodes:
          type: integer
          description: Limit results to plans with this number of nodes.
          minimum: 1

        region:
          type: string
          description: >-
            Limit results to plans available in a Vultr region ID, such as ewr.

    output:
      from_openapi: true
      include:
        - id
        - type
        - vcpu_count
        - ram
        - disk
        - number_of_nodes
        - max_connections
        - monthly_cost
        - supported_engines
        - locations

  - name: vultr_database_usage_get
    access: read
    enabled: true

    description: |
      Gets current resource usage for one Vultr Managed Database: disk, memory
      and CPU, each as the amount used against what the plan provides.

      Use this tool to check how close a database is to its limits, or whether
      it needs a larger plan.

      Do not use this tool for network bandwidth, which managed databases do
      not report here, or for the plan's specifications, which
      vultr_database_plans_list returns.

    operation: get-database-usage

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      include:
        - disk
        - memory
        - cpu

  - name: vultr_database_backups_get
    access: read
    enabled: true

    description: |
      Gets the backup window for one Vultr Managed Database: the date and time
      of the most recent backup and of the oldest one still retained.

      Use this tool to check that a database is being backed up, and to find
      the earliest point it could be restored to.

      Do not use this tool for compute instance backups or snapshots, which are
      separate products with their own tools.

    operation: get-backup-information

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    # No `output` block: the response carries latest_backup and oldest_backup
    # side by side, and shaping applies to a single container. Both are two
    # fields each, so the whole payload passes through.

  - name: vultr_database_versions_list
    access: read
    enabled: true

    description: |
      Lists the engine versions one Vultr Managed Database can be upgraded to.

      Use this tool to check whether an upgrade is available for a specific
      database before planning one.

      Do not use this tool for the engines and versions available to new
      databases, which vultr_database_services_list returns, or for the version
      a database currently runs, which vultr_database_clusters_get returns.

    operation: list-available-versions

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    # No `output` block: available_versions is a bare array of version strings,
    # so there are no item fields to allowlist against.

  - name: vultr_database_maintenance_updates_list
    access: read
    enabled: true

    description: |
      Lists the maintenance updates pending for one Vultr Managed Database,
      as the update descriptions the service reports.

      Use this tool to check whether a database has maintenance waiting before
      scheduling a window.

      Do not use this tool for engine version upgrades, which
      vultr_database_versions_list returns, or for the maintenance day and time
      configured on the database, which vultr_database_clusters_get returns.

    operation: list-maintenance-updates

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    # No `output` block: available_updates is a bare array of strings, so there
    # are no item fields to allowlist against.

  - name: vultr_database_logical_databases_list
    access: read
    enabled: true

    description: |
      Lists the logical databases inside one Vultr Managed Database instance --
      the named databases a client connects to, not the managed service itself.

      Use this tool to find what database names exist on an instance before
      connecting or granting access.

      Do not use this tool to list managed database instances, which
      vultr_database_clusters_list returns; this tool looks inside one of them.

    operation: list-database-dbs

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      include:
        - name
        - meta

  - name: vultr_database_logical_databases_get
    access: read
    enabled: true

    description: |
      Gets one logical database inside a Vultr Managed Database instance by
      name, confirming it exists.

      Use this tool when the logical database name is already known. To list
      them, use vultr_database_logical_databases_list.

      Do not use this tool for the managed database instance itself, which
      vultr_database_clusters_get returns, or for the tables inside a logical
      database, which this API does not expose.

    operation: get-database-db

    input:
      type: object
      required:
        - database_id
        - db_name
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

        db_name:
          type: string
          description: >-
            Name of the logical database, as returned in the name field by
            vultr_database_logical_databases_list.
          maps_to: db-name

    output:
      from_openapi: true
      include:
        - name

  - name: vultr_database_connection_pools_list
    access: read
    enabled: true

    description: |
      Lists the connection pools on one Vultr Managed Database (PostgreSQL),
      each with its pool name, the logical database and user it connects as,
      its mode and its size, alongside the instance's overall connection
      counts.

      Use this tool to report how pooling is configured, or to find which pool
      serves a given database.

      Do not use this tool for database users, which
      vultr_database_users_list returns, or for logical databases, which
      vultr_database_logical_databases_list returns.

    operation: list-connection-pools

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      include:
        - name
        - database
        - username
        - mode
        - size
        - connections
        - meta

  - name: vultr_database_connection_pools_get
    access: read
    enabled: true

    description: |
      Gets one connection pool on a Vultr Managed Database by name, with the
      logical database and user it connects as, its mode and its size.

      Use this tool when the pool name is already known. To list them, use
      vultr_database_connection_pools_list.

      Do not use this tool for the instance's overall connection counts, which
      the list tool returns alongside the pools.

    operation: get-connection-pool

    input:
      type: object
      required:
        - database_id
        - pool_name
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

        pool_name:
          type: string
          description: >-
            Name of the connection pool, as returned in the name field by
            vultr_database_connection_pools_list.
          maps_to: pool-name

    output:
      from_openapi: true
      include:
        - name
        - database
        - username
        - mode
        - size

  - name: vultr_database_advanced_options_list
    access: read
    enabled: true

    description: |
      Lists the advanced engine options for one Vultr Managed Database: every
      option that can be set, with its type, permitted range or values and
      units, alongside the options currently configured.

      Use this tool to see how an engine is tuned, or what a setting may be
      changed to.

      Do not use this tool for Kafka Connect, Kafka REST or Schema Registry
      options, which are separate tools, and not for the database's plan or
      status.

    operation: list-advanced-options

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      include:
        - name
        - type
        - units
        - min_value
        - max_value
        - enumerals
        - alt_values
        - configured_options

  - name: vultr_database_kafka_connect_options_list
    access: read
    enabled: true

    description: |
      Lists the advanced Kafka Connect options for one Vultr Managed Database
      running Kafka: every option that can be set, with its type, permitted
      range or values and units, alongside those currently configured.

      Use this tool to see how Kafka Connect is tuned on a specific database.

      Do not use this tool for the engine's general advanced options, which
      vultr_database_advanced_options_list returns, nor for Kafka REST or
      Schema Registry options, which have their own tools.

    operation: list-advanced-options-kafka-connect

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      include:
        - name
        - type
        - units
        - min_value
        - max_value
        - enumerals
        - alt_values
        - configured_options

  - name: vultr_database_kafka_rest_options_list
    access: read
    enabled: true

    description: |
      Lists the advanced Kafka REST options for one Vultr Managed Database
      running Kafka: every option that can be set, with its type, permitted
      range or values and units, alongside those currently configured.

      Use this tool to see how the Kafka REST proxy is tuned on a specific
      database.

      Do not use this tool for the engine's general advanced options, which
      vultr_database_advanced_options_list returns, nor for Kafka Connect or
      Schema Registry options, which have their own tools.

    operation: list-advanced-options-kafka-rest

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      include:
        - name
        - type
        - units
        - min_value
        - max_value
        - enumerals
        - alt_values
        - configured_options

  - name: vultr_database_schema_registry_options_list
    access: read
    enabled: true

    description: |
      Lists the advanced Schema Registry options for one Vultr Managed Database
      running Kafka: every option that can be set, with its type, permitted
      range or values and units, alongside those currently configured.

      Use this tool to see how the Schema Registry is tuned on a specific
      database.

      Do not use this tool for the engine's general advanced options, which
      vultr_database_advanced_options_list returns, nor for Kafka Connect or
      Kafka REST options, which have their own tools.

    operation: list-advanced-options-schema-registry

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      include:
        - name
        - type
        - units
        - min_value
        - max_value
        - enumerals
        - alt_values
        - configured_options

  - name: vultr_database_topics_list
    access: read
    enabled: true

    description: |
      Lists the Kafka topics on one Vultr Managed Database, each with its
      partition count, replication factor, and retention in hours and bytes.

      Use this tool to find what topics exist on a Kafka database and how they
      are configured.

      Do not use this tool for the messages inside a topic, which need a Kafka
      client rather than this API, or for logical databases on a SQL engine,
      which vultr_database_logical_databases_list returns.

    operation: list-database-topics

    input:
      type: object
      required:
        - database_id
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

    output:
      from_openapi: true
      include:
        - name
        - partitions
        - replication
        - retention_hours
        - retention_bytes
        - meta

  - name: vultr_database_topics_get
    access: read
    enabled: true

    description: |
      Gets one Kafka topic on a Vultr Managed Database by name, with its
      partition count, replication factor, and retention in hours and bytes.

      Use this tool when the topic name is already known. To list them, use
      vultr_database_topics_list.

      Do not use this tool for the messages inside the topic, which need a
      Kafka client rather than this API.

    operation: get-database-topic

    input:
      type: object
      required:
        - database_id
        - topic_name
      properties:
        database_id:
          type: string
          description: >-
            ID of the managed database, as returned in the id field by
            vultr_database_clusters_list.
          maps_to: database-id

        topic_name:
          type: string
          description: >-
            Name of the Kafka topic, as returned in the name field by
            vultr_database_topics_list.
          maps_to: topic-name

    output:
      from_openapi: true
      include:
        - name
        - partitions
        - replication
        - retention_hours
        - retention_bytes

  - name: vultr_database_quotas_list
    access: read
    enabled: true

    description: |
      Lists the Kafka quotas on one Vultr Managed Database, each capping a
      client and user pair's producer and consumer byte rates and its share of
      request handler time.

      Use this tool to report which clients are rate-limited and by how much.

      Do not use this tool for the database's own plan limits or resource
      usage, which vultr_database_usage_get returns.

