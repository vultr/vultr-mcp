product_area: clusters
family: compute

tools:
  - name: vultr_compute_clusters_search
    access: read
    enabled: true

    description: |
      Searches for Vultr Compute Clusters in the active Vultr organization.

      Use this tool to list, find, count, or select Compute Clusters, including
      GPU and fabric-connected clusters. Results can be filtered by label,
      region, plan, status, state, or cluster type.

      Do not use this tool for Vultr Kubernetes Engine clusters or Object
      Storage clusters.

    operation: list-clusters

    input:
      type: object
      properties:
        label:
          type: string
          description: Case-insensitive text contained in the cluster label.
          filter:
            field: label
            match: contains_ci

        region:
          type: string
          description: Vultr region ID, such as ewr.
          filter:
            field: region
            match: equals

        plan:
          type: string
          description: Vultr plan ID used by the cluster.
          filter:
            field: plan
            match: equals

        status:
          type: string
          description: Cluster subscription or provisioning status.
          filter:
            field: status
            match: equals

        state:
          type: string
          description: Cluster operational state.
          filter:
            field: state
            match: equals

        cluster_type:
          type: string
          description: >-
            Kind of Compute Cluster, as the API reports it, such as fabric.
            Not the same as the type field, which says whether a result is a
            Compute Cluster or a VKE cluster.
          filter:
            field: cluster_type
            match: equals

        page_size:
          type: integer
          description: >-
            Maximum number of results to return. When a search filter is
            supplied, the server scans the account and returns up to this many
            matches, reporting in meta.filtered how much it scanned.
          default: 100
          minimum: 1
          maximum: 500
          maps_to: per_page

        cursor:
          type: string
          description: Cursor returned by a previous request for the next page.

    output:
      from_openapi: true
      include:
        - id
        - label
        - region
        - plan
        - type
        - cluster_type
        - status
        - state
        - min_pool_count
        - desired_pool_count
        - instances
        - date_created
        - meta

    computed:
      instance_count:
        type: integer
        description: Number of instances associated with the cluster.
        from: length(instances)
