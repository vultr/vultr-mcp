# The interface layer manifest; bump the version when a definition change could move tool-selection scores.
# One directory per endpoint group (app.py ENDPOINT_GROUPS); a large area lists several files but stays one entry,
# since drift matches each area's name to an OpenAPI tag.

version: 2026.10.1

schema: schema/interface.schema.json

product_areas:
  # -- account -----------------------------------------------------------------
  account: account/account.yaml
  billing: account/billing.yaml
  logs: account/logs.yaml
  ssh: account/ssh.yaml
  subaccount: account/subaccount.yaml
  tickets: account/tickets.yaml

  # -- catalog: what can be deployed, and where --------------------------------
  application: catalog/application.yaml
  iso: catalog/iso.yaml
  marketplace:
    - catalog/marketplace/apps.yaml
    - catalog/marketplace/vendor.yaml
  os: catalog/os.yaml
  plans: catalog/plans.yaml
  region: catalog/region.yaml

  # -- compute -----------------------------------------------------------------
  backup: compute/backup.yaml
  baremetal:
    - compute/baremetal/baremetal.yaml
    - compute/baremetal/networking.yaml
    - compute/baremetal/operations.yaml
  clusters: compute/clusters.yaml
  instance_templates: compute/instance_templates.yaml
  instances:
    - compute/instances/instances.yaml
    - compute/instances/configuration.yaml
    - compute/instances/networking.yaml
    - compute/instances/operations.yaml
  snapshot: compute/snapshot.yaml
  startup: compute/startup.yaml

  # -- databases ---------------------------------------------------------------
  managed_databases:
    - databases/catalog.yaml
    - databases/clusters.yaml
    - databases/connectors.yaml
    - databases/databases.yaml
    - databases/kafka.yaml
    - databases/users.yaml

  # -- inference ---------------------------------------------------------------
  serverless_inference: inference/serverless_inference.yaml

  # -- kubernetes --------------------------------------------------------------
  kubernetes:
    - kubernetes/clusters.yaml
    - kubernetes/node_pools.yaml
    - kubernetes/versions.yaml

  # -- network -----------------------------------------------------------------
  cdns:
    - network/cdns/pull_zones.yaml
    - network/cdns/push_zones.yaml
  dns: network/dns.yaml
  firewall: network/firewall.yaml
  load_balancer:
    - network/load_balancer/load_balancers.yaml
    - network/load_balancer/rules.yaml
  reserved_ip: network/reserved_ip.yaml
  vpcs:
    - network/vpcs/vpcs.yaml
    - network/vpcs/nat_gateways.yaml

  # -- registry ----------------------------------------------------------------
  container_registry:
    - registry/catalog.yaml
    - registry/policies.yaml
    - registry/registries.yaml
    - registry/repositories.yaml

  # -- storage -----------------------------------------------------------------
  block: storage/block.yaml
  s3: storage/s3.yaml
  storage_gateways: storage/storage_gateways.yaml
  vfs: storage/vfs.yaml
