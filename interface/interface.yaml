# Top-level manifest for the Vultr MCP interface layer.
#
# The version is what the eval framework pins and reports against, so bump it
# whenever a definition changes in a way that could move tool-selection scores.
# openapi.json stays the source of truth for the REST API; this layer only
# controls what the agent sees.
#
# Area files are grouped into one directory per endpoint -- ENDPOINT_GROUPS in
# src/vultr_mcp/app.py -- so the tree matches what a client can load:
# interface/compute/ holds everything /mcp/compute serves. That is the product
# family (the second segment of every tool name) with two differences, both
# from the endpoints: marketplace sits under catalog/, and the database family's
# directory is databases/. test_interface checks every area lives under its
# endpoint's directory. The grouping is for people reading the repo: the
# compiler only resolves these paths, and nothing about the directory layout
# reaches the agent, which sees a flat tool list over MCP.
#
# A large area lists several files instead of one. Where it shares an endpoint
# with other areas it gets a directory of its own (compute/instances/,
# catalog/marketplace/); where it is the endpoint's only area, its files are the
# endpoint's directory (databases/, kubernetes/, registry/). Those files are
# read as though concatenated. Such an area MUST stay one entry here rather than
# becoming several: drift matches an area's name against an OpenAPI tag, so
# siblings would carry names matching no tag, and every operation under the real
# tag would be reported as undetected drift in the others.

version: 2026.10.1

schema: schema/interface.schema.json

product_areas:
  # -- account -----------------------------------------------------------------
  account: account/account.yaml
  billing: account/billing.yaml
  logs: account/logs.yaml
  ssh: account/ssh.yaml
  subaccount: account/subaccount.yaml
  tickets: account/tickets.yaml

  # -- catalog: what can be deployed, and where --------------------------------
  application: catalog/application.yaml
  iso: catalog/iso.yaml
  marketplace:
    - catalog/marketplace/apps.yaml
    - catalog/marketplace/vendor.yaml
  os: catalog/os.yaml
  plans: catalog/plans.yaml
  region: catalog/region.yaml

  # -- compute -----------------------------------------------------------------
  backup: compute/backup.yaml
  baremetal:
    - compute/baremetal/baremetal.yaml
    - compute/baremetal/networking.yaml
    - compute/baremetal/operations.yaml
  clusters: compute/clusters.yaml
  instance_templates: compute/instance_templates.yaml
  instances:
    - compute/instances/instances.yaml
    - compute/instances/configuration.yaml
    - compute/instances/networking.yaml
    - compute/instances/operations.yaml
  snapshot: compute/snapshot.yaml
  startup: compute/startup.yaml

  # -- databases ---------------------------------------------------------------
  managed_databases:
    - databases/catalog.yaml
    - databases/clusters.yaml
    - databases/connectors.yaml
    - databases/databases.yaml
    - databases/kafka.yaml
    - databases/users.yaml

  # -- inference ---------------------------------------------------------------
  serverless_inference: inference/serverless_inference.yaml

  # -- kubernetes --------------------------------------------------------------
  kubernetes:
    - kubernetes/clusters.yaml
    - kubernetes/node_pools.yaml
    - kubernetes/versions.yaml

  # -- network -----------------------------------------------------------------
  cdns:
    - network/cdns/pull_zones.yaml
    - network/cdns/push_zones.yaml
  dns: network/dns.yaml
  firewall: network/firewall.yaml
  load_balancer:
    - network/load_balancer/load_balancers.yaml
    - network/load_balancer/rules.yaml
  reserved_ip: network/reserved_ip.yaml
  vpcs:
    - network/vpcs/vpcs.yaml
    - network/vpcs/nat_gateways.yaml

  # -- registry ----------------------------------------------------------------
  container_registry:
    - registry/catalog.yaml
    - registry/policies.yaml
    - registry/registries.yaml
    - registry/repositories.yaml

  # -- storage -----------------------------------------------------------------
  block: storage/block.yaml
  s3: storage/s3.yaml
  storage_gateways: storage/storage_gateways.yaml
  vfs: storage/vfs.yaml
