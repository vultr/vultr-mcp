# Top-level manifest for the Vultr MCP interface layer.
#
# The version is what the eval framework pins and reports against, so bump it
# whenever a definition changes in a way that could move tool-selection scores.
# openapi.json stays the source of truth for the REST API; this layer only
# controls what the agent sees.

version: 2026.09.5

schema: schema/interface.schema.json

product_areas:
  account: account.yaml
  baremetal: baremetal.yaml
  clusters: clusters.yaml
  container_registry: container_registry.yaml
  logs: logs.yaml
  managed_databases: managed_databases.yaml
  serverless_inference: serverless_inference.yaml
  instances: instances.yaml
  kubernetes: kubernetes.yaml
  s3: s3.yaml
  vpcs: vpcs.yaml
  dns: dns.yaml
  firewall: firewall.yaml
  load_balancer: load_balancer.yaml
  reserved_ip: reserved_ip.yaml
  block: block.yaml
  snapshot: snapshot.yaml
  backup: backup.yaml
  vfs: vfs.yaml
  storage_gateways: storage_gateways.yaml
  region: region.yaml
  plans: plans.yaml
  os: os.yaml
  application: application.yaml
  iso: iso.yaml
  instance_templates: instance_templates.yaml
  startup: startup.yaml
  ssh: ssh.yaml
  subaccount: subaccount.yaml
