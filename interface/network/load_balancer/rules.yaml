product_area: load_balancer
family: network

# The load_balancer area is split across this directory; every file here
# declares the same product_area, and interface.yaml lists them together.

# What a load balancer forwards, and what it will accept.

tools:
  - name: vultr_network_load_balancer_forwarding_rules_list
    access: read
    enabled: true

    description: |
      Lists the forwarding rules on one Vultr load balancer, each mapping a
      frontend protocol and port to a backend protocol and port.

      Use this tool to find how a load balancer routes traffic to its
      instances, or which ports it listens on.

      Do not use this tool for the load balancer's firewall rules, which
      restrict who may connect rather than where traffic goes, or for NAT
      gateway port forwarding, which is a different product.

    operation: list-load-balancer-forwarding-rules

    input:
      type: object
      required:
        - load_balancer_id
      properties:
        load_balancer_id:
          type: string
          description: >-
            ID of the load balancer, as returned in the id field by
            vultr_network_load_balancers_list.
          maps_to: load-balancer-id

        page_size:
          type: integer
          description: Maximum number of results to return.
          default: 100
          minimum: 1
          maximum: 500
          maps_to: per_page

        cursor:
          type: string
          description: Cursor returned by a previous request for the next page.

    output:
      from_openapi: true
      include:
        - id
        - frontend_protocol
        - frontend_port
        - backend_protocol
        - backend_port
        - meta

  - name: vultr_network_load_balancer_forwarding_rules_get
    access: read
    enabled: true

    description: |
      Gets one forwarding rule on a Vultr load balancer by its ID, with its
      frontend and backend protocols and ports.

      Use this tool when a forwarding rule ID is already known. To list them,
      use vultr_network_load_balancer_forwarding_rules_list.

      Do not use this tool for the load balancer's firewall rules, which
      restrict who may connect rather than where traffic goes.

    operation: get-load-balancer-forwarding-rule

    input:
      type: object
      required:
        - load_balancer_id
        - forwarding_rule_id
      properties:
        load_balancer_id:
          type: string
          description: >-
            ID of the load balancer, as returned in the id field by
            vultr_network_load_balancers_list.
          maps_to: load-balancer-id

        forwarding_rule_id:
          type: string
          description: >-
            ID of the forwarding rule, as returned in the id field by
            vultr_network_load_balancer_forwarding_rules_list.
          maps_to: forwarding-rule-id

    output:
      from_openapi: true
      include:
        - id
        - frontend_protocol
        - frontend_port
        - backend_protocol
        - backend_port

  - name: vultr_network_load_balancer_firewall_rules_list
    access: read
    enabled: true

    description: |
      Lists the firewall rules on one Vultr load balancer, each with the port
      it applies to, the source address range permitted, and whether it is an
      IPv4 or IPv6 rule.

      Use this tool to audit who may connect to a load balancer.

      Do not use this tool for firewall groups, which protect instances and are
      a separate product read by vultr_network_firewall_group_rules_list, or
      for NAT gateway firewall rules, which belong to a VPC.

    operation: list-loadbalancer-firewall-rules

    input:
      type: object
      required:
        - loadbalancer_id
      properties:
        loadbalancer_id:
          type: string
          description: >-
            ID of the load balancer, as returned in the id field by
            vultr_network_load_balancers_list.
          maps_to: loadbalancer-id

    # No `output` block; see the note at the top of this file on why the
    # declared response shape cannot be shaped against.

  - name: vultr_network_load_balancer_firewall_rules_get
    access: read
    enabled: true

    description: |
      Gets one firewall rule on a Vultr load balancer by its ID, with its port,
      permitted source range, and whether it is an IPv4 or IPv6 rule.

      Use this tool when a rule ID is already known. To list them, use
      vultr_network_load_balancer_firewall_rules_list.

      Do not use this tool for firewall group rules, which protect instances
      and are a separate product.

    operation: get-loadbalancer-firewall-rule

    input:
      type: object
      required:
        - loadbalancer_id
        - firewall_rule_id
      properties:
        loadbalancer_id:
          type: string
          description: >-
            ID of the load balancer, as returned in the id field by
            vultr_network_load_balancers_list.
          maps_to: loadbalancer-id

        firewall_rule_id:
          type: string
          description: >-
            ID of the firewall rule, as returned in the id field by
            vultr_network_load_balancer_firewall_rules_list.
          maps_to: firewall-rule-id

    # No `output` block, for the same reason as the list tool above.
