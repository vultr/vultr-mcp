product_area: container_registry
family: registry

# Three credentials were on this surface, and one of them was invisible to the
# audit that found the others.
#
# `robots[].secret` is a robot account's password, on every row of the robots
# listing. That one a flat scan of response fields catches.
#
# `root_user.password` is nested one level down, inside an object every registry
# row carries, and both list-registries and read-registry return it. A scan of
# top-level fields cannot see it, which is why the audit had to learn to recurse
# before this file could be written.
#
# That nesting is also the constraint these tools are shaped around: `include`
# allowlists the top level of an item and a nested object passes through whole.
# There is no way to keep `root_user.username` while dropping
# `root_user.password`, so the whole object goes. The username is available from
# the registry's own `name` in practice, and no question about a registry needs
# the root password.
#
# The two docker-credentials operations are not here and must not be. They mint
# registry credentials on demand, and Vultr models them as OPTIONS -- which the
# read-only surface drops as a write, but which the interface layer read as a
# GET until this file was written. Fixing that was a prerequisite: a tool for
# one of them would have validated as `access: read` and been served on the
# safe surface.

declined:
  create-registry-docker-credentials:
    reason: >-
      Mints a Docker credential for the registry, on demand, for whoever asks.
      Modelled as OPTIONS rather than POST, which is why it needs saying out
      loud: this is a write in every sense except the verb, and it belongs
      behind the write surface if it is ever exposed at all.
  create-registry-kubernetes-docker-credentials:
    reason: >-
      The same credential-minting operation in Kubernetes secret form, and the
      same answer.
  read-replication:
    reason: >-
      GET /registry/{registry-id}/replication/{region} cannot be called as the
      spec describes it. The only parameter it declares beside registry-id is
      named "VCR Region", with no `in` and no `schema`, so nothing fills the
      {region} placeholder in the path and the layer would build a URL with the
      braces still in it. vultr_registry_replications_list returns every field
      this one does -- region, namespace and urn -- for all policies on a
      registry, so nothing is lost. Reported upstream.

tools:
  - name: vultr_registry_registries_list
    access: read
    enabled: true

    description: |
      Lists Vultr Container Registries in the active Vultr organization, with
      their region, storage usage, and whether each is public.

      Use this tool to list, find, or count container registries, and to get
      the registry ID the repository and robot tools need.

      Do not use this tool for Docker images or tags inside a registry, which
      come from the repository and artifact tools, nor for Vultr Kubernetes
      Engine, which is a separate product.

    operation: list-registries

    input:
      type: object
      properties:
        name_contains:
          type: string
          description: >-
            Case-insensitive text contained in the registry name.
          filter:
            field: name
            match: contains_ci

    output:
      from_openapi: true
      # root_user is absent entirely: it nests `password`, and include cannot
      # reach inside a nested object to drop one field.
      include:
        - id
        - name
        - urn
        - public
        - storage
        - metadata
        - date_created
        - meta

  - name: vultr_registry_registries_get
    access: read
    enabled: true

    description: |
      Gets one Vultr Container Registry by its ID, including its region,
      storage allowance and usage, and whether it is public.

      Use this tool when a registry ID is already known. To find one, use
      vultr_registry_registries_list first.

      Do not use this tool to list the images a registry holds; that is
      vultr_registry_repositories_list.

    operation: read-registry

    input:
      type: object
      required:
        - registry_id
      properties:
        registry_id:
          type: string
          description: >-
            ID of the container registry, as returned in the id field by
            vultr_registry_registries_list.
          maps_to: registry-id

    output:
      from_openapi: true
      # This response is the registry itself rather than a wrapper around one,
      # so the include list applies to the payload directly. root_user is
      # withheld here for the same reason as in the listing.
      include:
        - id
        - name
        - urn
        - public
        - storage
        - metadata
        - date_created

  - name: vultr_registry_repositories_list
    access: read
    enabled: true

    description: |
      Lists the image repositories inside one Vultr Container Registry, with
      artifact counts and pull counts.

      Use this tool to answer what images a registry holds and how much each is
      pulled.

      Do not use this tool for the registry itself, which is
      vultr_registry_registries_get, nor for the tags and digests of a single
      image.

    operation: list-registry-repositories

    input:
      type: object
      required:
        - registry_id
      properties:
        registry_id:
          type: string
          description: >-
            ID of the container registry, as returned in the id field by
            vultr_registry_registries_list.
          maps_to: registry-id

        name_contains:
          type: string
          description: >-
            Case-insensitive text contained in the repository name.
          filter:
            field: name
            match: contains_ci

    output:
      from_openapi: true
      include:
        - name
        - image
        - description
        - artifact_count
        - pull_count
        - added_at
        - updated_at
        - meta

  - name: vultr_registry_robots_list
    access: read
    enabled: true

    description: |
      Lists the robot accounts on one Vultr Container Registry, with their
      permissions and whether each is disabled.

      Use this tool to answer which automated identities can reach a registry
      and what they are allowed to do.

      Do not use this tool for Vultr account users or IAM identities, which are
      unrelated and not exposed through this server.

    operation: list-registry-robots

    input:
      type: object
      required:
        - registry_id
      properties:
        registry_id:
          type: string
          description: >-
            ID of the container registry, as returned in the id field by
            vultr_registry_registries_list.
          maps_to: registry-id

    output:
      from_openapi: true
      # `secret` is absent: it is the robot's password, and this tool answers
      # who can reach the registry without handing over the means to be them.
      include:
        - name
        - description
        - permissions
        - disable
        - duration
        - creation_time
        - meta

  - name: vultr_registry_repositories_get
    access: read
    enabled: true

    description: |
      Gets one image repository inside a Vultr Container Registry by name, with
      its description, artifact count, pull count, and when it was added and
      last updated.

      Use this tool when a repository name is already known. To find one, use
      vultr_registry_repositories_list first.

      Do not use this tool for the individual tags and digests inside the
      repository, which vultr_registry_artifacts_list returns, or for the
      registry itself.

    operation: read-registry-repository

    input:
      type: object
      required:
        - registry_id
        - repository_image
      properties:
        registry_id:
          type: string
          description: >-
            ID of the container registry, as returned in the id field by
            vultr_registry_registries_list.
          maps_to: registry-id

        repository_image:
          type: string
          description: >-
            Name of the repository image, as returned in the image field by
            vultr_registry_repositories_list.
          maps_to: repository-image

    output:
      from_openapi: true
      include:
        - name
        - image
        - description
        - artifact_count
        - pull_count
        - added_at
        - updated_at

  - name: vultr_registry_artifacts_list
    access: read
    enabled: true

    description: |
      Lists the artifacts in one repository of a Vultr Container Registry --
      the individual pushed images -- each with its digest, tags, size, media
      type, and push and pull times.

      Use this tool to find the tags available for an image, to identify an
      image by digest, or to see which artifacts are stale or oversized.

      Do not use this tool for the repository's summary counts, which
      vultr_registry_repositories_get returns, or to pull an image, which needs
      a Docker client rather than this API.

    operation: list-registry-repository-artifacts

    input:
      type: object
      required:
        - registry_id
        - repository_image
      properties:
        registry_id:
          type: string
          description: >-
            ID of the container registry, as returned in the id field by
            vultr_registry_registries_list.
          maps_to: registry-id

        repository_image:
          type: string
          description: >-
            Name of the repository image, as returned in the image field by
            vultr_registry_repositories_list.
          maps_to: repository-image

    output:
      from_openapi: true
      include:
        - digest
        - tags
        - size
        - type
        - artifact_type
        - media_type
        - manifest_media_type
        - repository_name
        - push_time
        - pull_time
        - meta

  - name: vultr_registry_replications_list
    access: read
    enabled: true

    description: |
      Lists the replication policies on one Vultr Container Registry -- the
      regions its images are copied to -- with each policy's region and
      namespace.

      Use this tool to report where a registry's images are replicated, or to
      check whether replication is configured at all.

      Do not use this tool for the regions a registry can be created in, which
      vultr_registry_regions_list returns, or for the registry's own region.

    operation: list-replications

    input:
      type: object
      required:
        - registry_id
      properties:
        registry_id:
          type: string
          description: >-
            ID of the container registry, as returned in the id field by
            vultr_registry_registries_list.
          maps_to: registry-id

    output:
      from_openapi: true
      include:
        - region
        - namespace
        - urn
        - meta

  - name: vultr_registry_retention_rules_list
    access: read
    enabled: true

    description: |
      Lists the retention rules on one Vultr Container Registry -- the policies
      that delete old artifacts automatically -- with each rule's action,
      template, parameters, tag and scope selectors, and whether it is
      disabled.

      Use this tool to report how a registry prunes images, or to check whether
      a retention policy is active before relying on an old tag.

      Do not use this tool to list the artifacts themselves, which
      vultr_registry_artifacts_list returns.

    operation: list-retention-rules

    input:
      type: object
      required:
        - registry_id
      properties:
        registry_id:
          type: string
          description: >-
            ID of the container registry, as returned in the id field by
            vultr_registry_registries_list.
          maps_to: registry-id

    output:
      from_openapi: true
      include:
        - id
        - action
        - template
        - params
        - tag_selectors
        - scope_selectors
        - disabled
        - meta

  - name: vultr_registry_retention_rules_get
    access: read
    enabled: true

    description: |
      Gets one retention rule on a Vultr Container Registry by its ID, with its
      action, template, parameters, tag and scope selectors, and whether it is
      disabled.

      Use this tool when a retention rule ID is already known. To find one, use
      vultr_registry_retention_rules_list first.

      Do not use this tool to list the artifacts a rule would delete, which
      vultr_registry_artifacts_list returns.

    operation: read-retention-rule

    input:
      type: object
      required:
        - registry_id
        - retention_rule_id
      properties:
        registry_id:
          type: string
          description: >-
            ID of the container registry, as returned in the id field by
            vultr_registry_registries_list.
          maps_to: registry-id

        retention_rule_id:
          type: integer
          description: >-
            ID of the retention rule, as returned in the id field by
            vultr_registry_retention_rules_list.
          maps_to: retention-rule-id

    # No `output` block. The response is one rule, but the shape reader picks
    # tag_selectors -- an array nested inside it -- as the container, so a
    # declared shape would describe the selectors rather than the rule. Nothing
    # here is worth trimming or withholding, so the payload passes through as
    # the API sends it.

  - name: vultr_registry_plans_list
    access: read
    enabled: true

    description: |
      Lists the Vultr Container Registry plans -- start-up, premium, business
      and enterprise -- with each one's storage allowance and monthly price.

      Use this tool to compare registry plans or to price one before creating
      it.

      Do not use this tool for the plan a registry is already on, which
      vultr_registry_registries_get returns, or for compute plans, which are a
      different product.

    operation: list-registry-plans

    input:
      type: object
      properties: {}

    output:
      from_openapi: true
      include:
        - start_up
        - premium
        - business
        - enterprise

  - name: vultr_registry_regions_list
    access: read
    enabled: true

    description: |
      Lists the regions a Vultr Container Registry can be created in, with each
      region's data centre, base URL, and whether it is public.

      Use this tool to find where a registry can be hosted, or to resolve a
      registry's region to its data centre and endpoint.

      Do not use this tool for Vultr regions in general, which cover compute
      and are a different list, or for the replication policies on an existing
      registry, which vultr_registry_replications_list returns.

    operation: list-registry-regions

    input:
      type: object
      properties: {}

    output:
      from_openapi: true
      include:
        - id
        - name
        - urn
        - base_url
        - data_center
        - public
        - added_at
        - updated_at
        - meta
