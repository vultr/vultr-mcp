name: CI

# Arranged so a spec update answers "what changed, and does it still work".
on:
  push:
    branches: [main]
  pull_request:
  # So a spec bump can be checked without opening a PR first.
  workflow_dispatch:
  # So release.yml publishes only what passed the same checks.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # Catches a spec FastMCP cannot parse at all.
      - name: Tests
        run: uv run pytest -q

      # Fails when a definition references something the spec no longer has; disabled tools only warn.
      - name: Validate the interface layer
        run: uv run python -m vultr_mcp.interface

      # Informational: new operations nobody has reviewed; fails only on a stale reference.
      - name: Interface drift
        run: uv run python -m vultr_mcp.interface --drift

  # Calls every compiled (read-only) tool against the real API, catching where the spec is wrong about responses.
  # Skipped without VULTR_API_KEY, so forks do not fail on a missing secret.
  smoke:
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Live smoke test
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
          VULTR_API_BASE_URL: ${{ vars.VULTR_API_BASE_URL }}
        run: |
          if [ -z "$VULTR_API_KEY" ]; then
            echo "VULTR_API_KEY is not configured; skipping the live smoke test."
            echo "Set it as a repository secret to exercise the runtime against a"
            echo "real API. Use a test account: whatever the API returns lands in"
            echo "the workflow log."
            exit 0
          fi
          uv run python scripts/smoke_interface.py
